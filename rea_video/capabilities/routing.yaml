# rea-video routing rules: shot features (signals) → primitive chain (route) → candidate models (prefer, by priority)
# Rules only reference primitive and model ids; the validation script checks reference integrity and "the model actually supports this primitive."
# When picking a model: skip status=shutdown; filter by regions_excluded and license; sort by cost among otherwise-equal options.

version: 0.1.0
updated: 2026-10-29

modes:
  fidelity: High-fidelity remake. Structure, rhythm, camera work, text, and motion are matched item by item, measured with a scorecard
  adapt: Creative adaptation. Keeps the relationships that made the original "work" (the hook, the reveal, the rhythm), with content rewritten around a new topic
  # The two modes can be mixed per layer, e.g. {rhythm: fidelity, camera: fidelity, people: adapt, copy: adapt}

# ---------------------------------------------------------------- Signals
# Shot features to detect during decomposition, and which analysis primitives provide the evidence
signals:
  text_or_ui_dominant: {detected_by: [analyze.ocr_text_track, analyze.video_understanding], desc: "Text/UI/charts/motion graphics are the main subject; sharp text edges, pixel alignment, regular trajectories"}
  screen_ui:           {detected_by: [analyze.video_understanding, analyze.ocr_text_track], desc: A software or web UI demo}
  talking_head_frontal: {detected_by: [analyze.video_understanding, analyze.asr_word_align, analyze.camera_motion], desc: Frontal talking-head, camera position essentially fixed}
  dialogue_coupled:    {detected_by: [analyze.asr_word_align, analyze.video_understanding], desc: A non-frontal shot where dialogue is tightly coupled to the picture (multi-person conversation, talking while doing something)}
  precise_motion:      {detected_by: [analyze.video_understanding, analyze.segmentation, analyze.beat_tempo], desc: Dance, outfit change, beat-synced gestures — where the motion itself is the point}
  garment_change:      {detected_by: [analyze.video_understanding], desc: An apparel e-commerce outfit change or showcase}
  physical_text_zh:    {detected_by: [analyze.ocr_text_track], desc: Physical text in the frame (sign, packaging, screen), especially Chinese}
  product_hero:        {detected_by: [analyze.video_understanding, analyze.segmentation], desc: Product appearance or composition must be exact}
  product_multiview:   {detected_by: [analyze.video_understanding, analyze.camera_motion], desc: A product rotating, shown from multiple angles}
  complex_camera:      {detected_by: [analyze.camera_motion, analyze.shot_boundary], desc: Complex camera work, occlusion transitions, instant transformations}
  lens_look:           {detected_by: [analyze.video_understanding], desc: A distinctive lens feel — focal length, depth of field, distortion}
  recurring_character: {detected_by: [analyze.video_understanding, analyze.segmentation], desc: The same character or product appears in multiple shots}
  owned_footage_edit:  {detected_by: [], desc: Existing footage the user has rights to use, needing only a person/object/background swap}
  redub_only:          {detected_by: [analyze.asr_word_align], desc: The performance stays; only the lines or language change}
  ambient_broll:       {detected_by: [analyze.video_understanding], desc: Mood filler footage with no specific subject}
  reusable_footage:    {detected_by: [], desc: The user's own footage can be reused directly}
  still_image_motion:  {detected_by: [analyze.camera_motion], desc: "The whole frame is a still image being panned/zoomed (Ken Burns); scale/pan parameters can be measured"}
  static_hold:         {detected_by: [analyze.shot_boundary], desc: A freeze frame (an image or card staying still)}
  anim_2d:             {detected_by: [analyze.video_understanding], desc: "2D animation (hand-drawn frame-by-frame, Live2D, AE/Spine character animation) — undetectable by the tool, judged by eye"}
  stop_motion:         {detected_by: [analyze.video_understanding], desc: "Stop motion (a physical object/clay/paper puppet shot frame by frame) — undetectable by the tool, judged by eye"}
  film_footage:        {detected_by: [analyze.video_understanding], desc: "Footage cut in from an existing movie/TV show/short drama (commentary, montage, highlight reel) — indistinguishable from live action or AI at the pixel level; the tool only gives clues (letterboxed layout, a 24/25fps source), judged by eye"}
  ai_edited_footage:   {detected_by: [analyze.video_understanding], desc: "Live-action footage that's been AI-edited afterward (face swap, lip sync, restyling, outfit swap, background swap)"}

# ---------------------------------------------------------------- Segmentation
segmentation:
  levels:
    edit_shot: An editing shot, found by cut detection — an objective fact
    generation_unit: A generation unit — the output of one model call, which doesn't map 1:1 to editing shots
    layer: Vertical layers within the same frame (code layer / generation layer / asset layer / subtitle layer)
  defaults:
    generation_unit_s: {min: 4, max: 15}
    multishot_hardcut_s: {prefer: 8, max: 10}   # S06: duration of consecutive hard cuts within a single generation unit
    motion_segment_s: {prefer: 10, max: 15, min: 3}   # length of each segment in a motion-driven video: cut at pauses — hands and feet are steadier in short segments
    same_scene_distance: 0.5                    # adjacent shots count as the same scene when the color-distribution distance (Bhattacharyya) between their first/last frames is below this
  rules:
    - id: S01-merge-multishot
      do: Consecutive shots with the same character and scene are merged into one generation unit and generated in a single call with video.multi_shot, as long as the total duration doesn't exceed the candidate model's limit
      why: Consistency and natural transitions are handled internally by the model
    - id: S02-split-duration
      do: When a shot exceeds the candidate model's single-call limit, cut it at an action pause, with the later segment using the earlier segment's last frame as its first frame (video.i2v_first_frame or i2v_first_last)
    - id: S03-split-transition
      do: Cut an occlusion transition, an instant outfit change, or a sharp motion change into its own segment, controlled precisely with first/last frames or keyframes
      why: "E.g. an outfit change hidden behind a spinning fan blade — mistiming it even slightly gives the trick away"
    - id: S04-vertical-layers
      do: Pull text, UI, graphics, and subtitles out into a code layer; let the footage underneath go through generation or an asset layer; composite at the end
      why: A generation model redrawing text will inevitably get it wrong; the code layer is 100% accurate and easy to edit
    - id: S05-end-state
      do: "Each generation unit's prompt spells out \"the action, and the end state\"; the end state becomes the connecting condition for the next unit"
    - id: S06-hardcut-guard
      do: Keep consecutive hard cuts within a single generation unit under about 8 seconds (from practical experience — beyond about 10 seconds problems get common)
    - id: S07-long-video
      do: Split a long video into segments by narrative section and process them separately, then stitch them together; at each seam, check product-appearance consistency, that subtitles match the selling points, and that motion connects smoothly

# ---------------------------------------------------------------- Visual routing
rules:
  - id: R01-code-graphics
    layer: overlay
    when: [text_or_ui_dominant]
    route: [render.code_graphics]
    prefer: [remotion, html-gsap-playwright, motion-canvas]
    verify: [ocr_text_match, layout_iou, timing_curve_error, pixel_similarity]
    why: Text and motion graphics need pixel-exact accuracy and need to stay editable; a generation model can't do that

  - id: R02-screen-demo
    layer: base
    when: [screen_ui]
    route: [render.web_capture, render.code_graphics]
    prefer: [html-gsap-playwright, remotion]
    verify: [ocr_text_match, layout_iou]
    why: Driving a recording with a real or rebuilt UI is more accurate than generating one

  - id: R03-talking-head
    layer: base
    when: [talking_head_frontal]
    route: [audio.voice_clone, avatar.audio_driven]
    prefer: [minimax-speech-2.8, omnihuman-2.0, kling-avatar-v2, heygen-avatar-v, ltx-2.3-lipsync]
    alternatives: A short shot can switch to a picture-and-sound-together model with an audio reference instead (R16)
    verify: [lip_sync, identity_consistency, speech_wer]

  - id: R04-precise-motion
    layer: base
    when: [precise_motion]
    route: [motion.transfer, video.reference_video, analyze.depth_video, analyze.pose_track, video.control_video, analyze.body_mocap, render.3d_scene]
    prefer: [kling-motion-control, seedance-2.5, wan-2.2-animate, wan-animate-2, video-depth-anything, dwpose, wan-vace, rokoko-vision, blender]
    verify: [motion_trajectory_error, identity_consistency, beat_alignment]
    why: The time-based behavior of motion can't be described with text and still frames; first/last frames only lock the two ends — the model has to guess the choreography in between
    alternatives: When the original performer's appearance or body shape would get carried over, switch to a depth video as the driver instead (swaps the person/scene, keeps the camera work) or a skeleton video (when the target's body shape differs a lot); when the camera angle needs to change or this motion will be reused, convert monocular mocap to a white model, re-set the camera in Blender and render, then generate using the white-model render as reference
    guard: Erase subtitles and stickers from the driving video first (otherwise they get learned in as part of the picture); cut it into short segments at pauses (hands/feet and turns are steadier in short segments); using someone else's dance video as a driver raises portrait-rights and copyright concerns

  - id: R05-garment
    layer: base
    when: [garment_change]
    route: [image.tryon, video.i2v_first_frame, motion.transfer]
    prefer: [fashn-tryon-max, kling-virtual-tryon-3, fashn-v1.6, seedance-2.5, kling-3.0, kling-motion-control]
    verify: [identity_consistency, perceptual_similarity]
    why: Producing and confirming a try-on image first, then animating it, is more stable than letting a video model change outfits directly

  - id: R06-physical-text-zh
    layer: base
    when: [physical_text_zh]
    route: [image.text_render, video.i2v_first_frame]
    prefer: [gpt-image-2.5, gpt-image-2.6, qwen-image-3.0-pro, seedream-5.5, seedream-5.0, seedance-2.5, kling-3.0]
    verify: [text_render_accuracy, ocr_text_match]
    guard: When text needs to stay sharp and stable for a long time, or there's heavy camera motion, switch to R01's code overlay instead (a video model will distort text while moving)

  - id: R07-product-hero
    layer: base
    when: [product_hero]
    route: [image.edit_multi_ref, video.i2v_first_frame, video.i2v_first_last]
    prefer: [gpt-image-2.5, gpt-image-2.6, nano-banana-2.1, seedream-5.5, seedream-5.0, seedance-2.5, kling-3.0, veo-3.1]
    verify: [identity_consistency, perceptual_similarity]
    why: Compositing and confirming a first frame from the product photo first locks the appearance before generating motion

  - id: R08-product-multiview
    layer: base
    when: [product_multiview]
    route: [threed.image_to_3d, render.3d_scene, video.reference_video]
    prefer: [hunyuan-3d, rodin-gen-2.5, blender, seedance-2.5]
    verify: [identity_consistency, camera_path_error]
    why: A 3D model guarantees multi-angle consistency; it can be rendered directly, or a white-model render can serve as a Seedance 2.5 reference

  - id: R09-complex-camera
    layer: base
    when: [complex_camera]
    route: [video.keyframes, video.i2v_first_last]
    prefer: [kling-4.0, kling-3.0, veo-3.1, runway-gen-4.5, minimax-h3]
    verify: [camera_path_error, cut_alignment]
    guard: If it's still uncontrollable, cut at the occlusion point (see S03)

  - id: R10-lens-look
    layer: base
    when: [lens_look]
    route: [video.camera_control]
    prefer: [pixverse-v6, kling-4.0, runway-gen-4.5, gemini-omni-flash]
    verify: [perceptual_similarity]

  - id: R11-recurring-character
    layer: base
    when: [recurring_character]
    route: [video.multi_reference, video.multi_shot]
    prefer: [seedance-2.5, kling-3.0, kling-o3, vidu-q3, kling-4.0]
    verify: [identity_consistency, cut_alignment]

  - id: R12-owned-footage-edit
    layer: base
    when: [owned_footage_edit]
    route: [video.edit_v2v]
    prefer: [kling-o3, kling-4.0, runway-aleph-2, luma-ray3.2, wan-2.2-animate, seedance-2.5]
    verify: [motion_trajectory_error, identity_consistency]

  - id: R13-redub
    layer: base
    when: [redub_only]
    route: [lipsync.redub]
    prefer: [sync-3, sync-react-1]
    verify: [lip_sync, speech_wer]

  - id: R14-ambient-broll
    layer: base
    when: [ambient_broll]
    route: [video.t2v]
    prefer: [minimax-h3, hailuo-2.3, seedance-2.0, wan-2.2, seedance-2.5]
    verify: [perceptual_similarity]
    why: The cheapest route — sorted by cost

  - id: R15-reuse-footage
    layer: base
    when: [reusable_footage]
    route: [render.compose]
    prefer: [ffmpeg]
    verify: [cut_alignment]

  - id: R17-still-motion
    layer: base
    when: [still_image_motion]
    route: [image.edit_multi_ref, render.compose]
    prefer: [gpt-image-2.5, seedream-5.0, ffmpeg]
    verify: [camera_path_error, perceptual_similarity]
    why: The decomposition step already measured the scale/pan curve — one image plus local ffmpeg can reproduce the motion exactly, no video model needed

  - id: R18-static-hold
    layer: base
    when: [static_hold]
    route: [image.edit_multi_ref, render.compose]
    prefer: [gpt-image-2.5, seedream-5.0, ffmpeg]
    verify: [perceptual_similarity]

  - id: R19-2d-animation
    layer: base
    when: [anim_2d]
    route: [image.t2i, video.i2v_first_last, video.multi_reference]
    prefer: [kling-3.0, seedance-2.5, vidu-q3]
    verify: [identity_consistency, perceptual_similarity]
    why: Fix the character and art style first with an image model (one turnaround sheet), then generate with first/last frames; when frame-exact lip sync and motion is needed, switch to an AE / Live2D / Spine project instead

  - id: R20-stop-motion
    layer: base
    when: [stop_motion]
    route: [video.i2v_first_frame]
    prefer: [kling-3.0, seedance-2.5, vidu-q3]
    verify: [perceptual_similarity]
    why: "Best to actually shoot it: a phone on a fixed mount + a stop-motion app at 12 shots/sec; AI generation can only approximate the jerky stop-motion feel — spell out stop-motion, 12fps in the prompt"

  - id: R21-film-footage
    layer: base
    when: [film_footage]
    route: [render.compose]
    prefer: [ffmpeg]
    verify: [perceptual_similarity]
    why: "The footage comes from an existing film/show — remaking it means finding and cutting in the matching source clip (copyright belongs to the studio, commercial use needs licensing); without the original, shoot your own with the same framing, camera position, and lighting, or approximate with AI (R07)"

  - id: R16-dialogue-coupled
    layer: base
    when: [dialogue_coupled]
    route: [video.native_audio, video.multi_reference]
    prefer: [seedance-2.5, kling-3.0, veo-3.1, gemini-omni-flash, kling-4.0]
    verify: [lip_sync, speech_wer, identity_consistency]

# ---------------------------------------------------------------- Audio routing
audio_rules:
  - id: A01-narration
    when: There's narration or a talking-head
    route: [analyze.asr_word_align, audio.voice_clone, audio.tts]
    prefer: [funasr-sensevoice, whisperx, minimax-speech-2.8, cosyvoice-3, qwen3-tts, elevenlabs-v3]
    verify: [speech_wer]
    note: For Chinese, prefer a MiniMax clone; for emotive English, prefer ElevenLabs
  - id: A02-fit-time-window
    when: New dubbing must fit exactly into the original time window (lip sync, matching the picture)
    route: [audio.tts_duration_control]
    prefer: [indextts-2]
    verify: [audio_duration_match, speech_wer]
  - id: A03-music
    when: There's background music
    route: [analyze.audio_separation, analyze.beat_tempo, audio.music_gen]
    prefer: [demucs, librosa-madmom, lyria-3-pro, minimax-music-2.5]
    verify: [beat_alignment]
    note: Don't carry over the original track directly; generate a new one close in BPM and mood, or use a licensed library. Suno has no API, so it's only suitable for manual use
  - id: A04-sfx
    when: There are action sound effects or ambient sound
    route: [audio.v2a_foley, audio.sfx_gen]
    prefer: [hunyuanvideo-foley, elevenlabs-sfx]
    verify: [beat_alignment]
    note: HunyuanVideo-Foley's license excludes the EU, UK, and South Korea; MMAudio's weights can't be used commercially
  - id: A05-lip-mismatch
    when: The generated footage's lip movement doesn't sync with the new audio
    route: [lipsync.redub]
    prefer: [sync-3, sync-react-1]
    verify: [lip_sync]

# ---------------------------------------------------------------- Post-production
post_rules:
  - id: P01-upscale
    when: The draft resolution is lower than the delivery resolution
    route: [post.upscale]
    prefer: [seedvr2, flashvsr, topaz-video]
    note: Real-ESRGAN isn't recommended for generated video (introduces blocky artifacts)
  - id: P02-interp
    when: Frame rate is insufficient or slow motion is needed
    route: [post.frame_interp]
    prefer: [rife, topaz-video]

# ---------------------------------------------------------------- Cost and confirmation
cost_policy:
  - Estimate the cost of each generation unit first (duration × usd_per_s); have the user confirm the total budget at G1
  - Produce a keyframe image or try-on image first (cheap), confirm it, then generate video (expensive)
  - Draft at 480p or 720p first, confirm it, then upscale to delivery resolution (measurably lowers cost)
  - Prefer merging multiple shots of the same character into one multi-shot generation call (S01)
  - Finished generation units are cached by (input hash + model + parameters); a rewrite only reruns the affected units

confirm_gates:
  G1: Requirements, mode (fidelity/adapt), budget, and account
  G2: Shot list + keyframe images / try-on images / first frames
  G3: A low-resolution draft cut
  G4: The upscaled final cut and scorecard

# ---------------------------------------------------------------- Prompt discipline
# General rules; each model's specific writing style is in prompting.yaml — where they disagree, that file wins
prompting_rules:
  - Write only what you want to appear; don't write a negative sentence ("no phone" tends to make a phone appear anyway)
  - Spell out "the action, and the end state"
  - Label each input's job: identity reference, product facts, motion/camera reference, audio reference, dialogue
  - Avoid figurative language — the model will render a metaphor as a literal object or event
  - Leave exact quantities (counting on fingers, etc.) to subtitles or motion graphics — don't make the model perform them
  - Give the performance an actionable attitude, not a list of actions
