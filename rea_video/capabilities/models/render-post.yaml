# Code render / compositing / post-production

models:
  - id: remotion
    name: Remotion
    vendor: "Remotion (open-source, commercial use needs a license)"
    category: render
    status: ga
    access: [open-weights]
    primitives: [render.code_graphics, render.compose]
    strengths:
      - Writes video in React: text, UI, charts, and motion graphics can all be 100% accurate and parametric
      - The vendor provides Agent Skills, usable directly with Claude Code and Codex
      - The render output is deterministic, so it can be diffed pixel-by-pixel against the original frame by frame
    weaknesses:
      - Photorealistic footage still needs to be layered with a generation layer
    license: {commercial: conditional, note: "Free for individuals and small teams; companies need to purchase a Remotion license"}
    sources:
      - https://www.tella.com/blog/how-to-use-remotion-agent-skills-with-claude-code
      - https://www.remotion.dev/
    verified: {date: 2026-10-29, basis: knowledge}
    confidence: high

