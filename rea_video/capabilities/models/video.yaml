# Video generation / editing models
# See ../README.md for field descriptions; most specs come from vendor announcements or third-party roundups — status/verified/confidence indicate reliability.
# The usd_per_s cost unit is converted from third-party listed prices, only a relative-cost reference for routing.

models:
  - id: seedance-2.5
    name: Seedance 2.5
    vendor: ByteDance Seed
    category: video
    release: 2026-07
    status: ga
    access: [app, api-aggregator]
    primitives: [video.t2v, video.i2v_first_frame, video.i2v_first_last, video.multi_reference, video.reference_video, video.reference_audio, video.multi_shot, video.extend, video.edit_v2v, video.camera_control, video.native_audio]
    limits:
      duration_s: {max: 30}
      resolutions: [480p, 720p, 1080p]
      refs: {image: 30, video: 10, audio: 10}
      # first/last frame and reference image/video/audio can't be in the same request (consistent across several vendor docs; Jimeng App's "omni-reference" can use @Image as a first frame)
      exclusive_inputs: [[video.i2v_first_frame, video.i2v_first_last], [video.multi_reference, video.reference_video, video.reference_audio]]
    audio: {native: true}
    strengths:
      - A single call produces 30 seconds containing multiple logically-connected shots
      - "Up to 30 images + 10 videos + 10 audio references per call; supports clay render (textureless 3D white model), motion, and creative reference"
      - Timestamp-level local edits, green-screen background swap, camera-position change, continuation/extension (up to several minutes)
      - "The go-to model for product remakes in China's e-commerce AI tooling (OiiOii, Hypit)"
    weaknesses:
      - "The vendor admits physical plausibility of complex motion and stability of multi-subject interaction still have gaps"
      - Max resolution isn't officially published; Hypit's HypiHub channel offers 480p/720p/1080p
    cost:
      note: "Measured reference: OiiOii remade a 50-second e-commerce video for about ¥40 (generated at 480p, then upscaled to 1080p)"
    license: {commercial: true, note: "Per the platform's terms"}
    sources:
      - https://seed.bytedance.com/en/blog/one-take-creation-flexible-referencing-introducing-seedance-2-5
      - https://github.com/hypit-ai/hypit/blob/main/packages/provider-hypihub/README.md
      - https://docs.byteplus.com/docs/en/modelark/seedance-2-5.md
      - https://apiframe.ai/docs/videos/seedance/seedance-2-5
    verified: {date: 2026-11-11, basis: vendor}
    confidence: high

