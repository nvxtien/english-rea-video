# 3D generation (product multi-angle consistency / turntable / white-model reference)

models:
  - id: hunyuan-3d
    name: Hunyuan 3D (3.x)
    vendor: Tencent
    category: threed
    status: ga
    access: [api, open-weights]
    primitives: [threed.image_to_3d]
    strengths:
      - The most stable of the three — rarely produces broken faces
      - Supports specifying viewpoint input; optional PBR materials, with 4K PBR textures as a paid add-on
      - Best suited for high-fidelity product showcases
    license: {commercial: true, note: "The hosted version can be used commercially; check the open-weights license separately"}
    sources:
      - https://www.3daistudio.com/blog/rodin-2-5-vs-tripo-vs-hunyuan-3d-comparison
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium

  - id: rodin-gen-2.5
    name: Rodin Gen-2.5
    vendor: Hyper3D / Deemos
    category: threed
    status: ga
    access: [api, app]
    primitives: [threed.image_to_3d]
    strengths:
      - 5 quality tiers; accepts 2–5 viewpoint images
      - Can remove baked-in lighting from the source image; has a symmetry toggle, good for symmetric objects like vehicles
    license: {commercial: true}
    sources:
      - https://www.3daistudio.com/blog/rodin-2-5-vs-tripo-vs-hunyuan-3d-comparison
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium

  - id: tripo-p1
    name: Tripo P1
    vendor: Tripo
    category: threed
    status: ga
    access: [api, app]
    primitives: [threed.image_to_3d]
    strengths:
      - Clean mesh (around 20k faces or under), with PBR textures; good for game-ready low-poly models
    weaknesses:
      - Not suited for high-fidelity product showcases
    license: {commercial: true}
    sources:
      - https://www.3daistudio.com/blog/rodin-2-5-vs-tripo-vs-hunyuan-3d-comparison
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium
