      - https://fal.ai/models/fal-ai/bytedance/omnihuman/v2/llms.txt
    verified: {date: 2026-11-12, basis: vendor}
    confidence: medium
    notes: "Launched on BytePlus 2026-10-15; image side length 300–6000 px, aspect ratio 0.4–2.5; can drive people, animals, anime, and 3D characters; unconfirmed whether Jimeng's digital avatar already uses 2.0"

