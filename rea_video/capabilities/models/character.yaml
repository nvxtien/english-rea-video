  - id: omnihuman-2.0
    name: OmniHuman 2.0
    vendor: ByteDance
    category: character
    release: 2026-10
    status: ga
    access: [app, api]
    primitives: [avatar.audio_driven]
    limits:
      audio_s: {min: 4, max: 300}
      resolutions: [720p]
    strengths:
      - One image plus one audio clip generates a long single-shot performance
      - Motion follows the semantics and rhythm; supports multiple people, non-human characters, and singing
      - Pose, camera, and interaction can be controlled with a prompt
    weaknesses:
      - Performance quality largely depends on how expressive the audio is
    cost: {usd_per_s: 0.07, note: "BytePlus: $0.07/s (down from $0.12); fal: $0.105"}
