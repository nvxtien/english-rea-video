# Character driving: motion transfer / digital avatar / lip-sync redub / virtual try-on

models:
  - id: kling-motion-control
    name: "Kling Motion Control (2.6 / 3.0)"
    vendor: Kuaishou
    category: character
    release: 2025-12
    status: ga
    access: [app, api, api-aggregator]
    primitives: [motion.transfer]
    strengths:
      - Transfers motion from a reference video onto a character image; third parties consider it the quality benchmark for motion control
      - Has a technical report (arXiv 2603.03160)
      - "Version 3.0 can bind a subject to keep the face consistent (face only, not clothing/hairstyle; only available in follow-the-video-orientation mode)"
    weaknesses:
      - Driving with someone else's video raises portrait-rights and copyright concerns
    license: {commercial: true, note: "Per the platform's terms"}
    sources:
      - https://arxiv.org/html/2603.03160v1
      - https://templix.app/blogs/best-ai-motion-control-and-animation-models-in-2026
      - https://kling.ai/quickstart/motion-control-user-guide
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium
    notes: "Version 3.0 hit the API 2026-03-04; reference video 3–30 seconds, one continuous shot, full body and head visible; for very fast motion, output can come out shorter than the reference"

