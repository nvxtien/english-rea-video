# Audio: dubbing / cloning / music / sound effects / video-to-sound-effect

models:
  - id: minimax-speech-2.8
    name: MiniMax Speech 2.8 (Turbo / HD)
    vendor: MiniMax
    category: audio
    release: 2026-06
    status: ga
    access: [api, api-aggregator]
    primitives: [audio.tts, audio.voice_clone]
    strengths:
      - "[User-confirmed] supports voice cloning"
      - First-tier Chinese, a native strength; supports Cantonese
    cost: {note: "Turbo is $30–60 per million characters, HD is $50–80 per million characters (third-party data, 2026-07)"}
    license: {commercial: true}
    sources:
      - https://peihuachen.github.io/ai-tools-hub/posts/tts-commercial-open-source-comparison-guide-2026.html
    verified: {date: 2026-10-29, basis: user}
    confidence: high
    notes: Release month is an estimate

  - id: indextts-2
    name: "IndexTTS2 / IndexTTS 2.5 (open-source, Bilibili)"
    vendor: Bilibili
    category: audio
    release: 2025-09
    status: ga
    access: [open-weights]
    primitives: [audio.tts, audio.voice_clone, audio.tts_duration_control]
    strengths:
      - Explicit duration control, rare for an autoregressive TTS — good for fitting new dubbing into the original time window
      - Emotion and timbre are decoupled; zero-shot cloning; Chinese/English bilingual
    weaknesses:
      - Needs to be self-hosted
    license: {commercial: conditional, note: "Per the repo's license"}
    sources:
      - https://arxiv.org/html/2506.21619v2
      - https://arxiv.org/html/2601.03888v3
    verified: {date: 2026-10-29, basis: vendor}
    confidence: high

  - id: qwen3-tts
    name: "Qwen3-TTS (open-source 1.7B / 0.6B)"
    vendor: Alibaba
    category: audio
    release: 2026-01
    status: ga
    access: [open-weights, api]
    primitives: [audio.tts, audio.voice_clone]
    strengths:
      - Can clone from just 3 seconds of audio; supports Cantonese, Sichuanese, Beijing dialect, Shanghainese
      - Apache 2.0; the Bailian API version supports text-instruction tone control
    license: {commercial: true, note: Apache 2.0}
    sources:
      - https://peihuachen.github.io/ai-tools-hub/posts/tts-commercial-open-source-comparison-guide-2026.html
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium
    notes: "Release month is an estimate; sources disagree on the audio length needed to clone (3 seconds, or 10–20 seconds)"

