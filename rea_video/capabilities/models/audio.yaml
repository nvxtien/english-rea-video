  - id: hunyuanvideo-foley
    name: HunyuanVideo-Foley
    vendor: Tencent
    category: audio
    release: 2025-08
    status: ga
    access: [open-weights, api-aggregator]
    primitives: [audio.v2a_foley]
    strengths:
      - Watches the video to generate synced sound effects, 48kHz; best sync metric (DeSync 0.74, vs. 0.80 for MMAudio)
    weaknesses:
      - Needs 8–20GB of VRAM
      - License excludes the EU, UK, and South Korea (third parties say the output is similarly restricted)
    license: {commercial: conditional, note: "Tencent community license"}
    regions_excluded: [EU, UK, KR]
    sources:
      - https://github.com/Tencent-Hunyuan/HunyuanVideo-Foley
      - https://www.creativeainews.com/articles/how-to-add-sound-effects-to-ai-video-2026/
    verified: {date: 2026-10-29, basis: third-party}
    confidence: high

  - id: mmaudio
    name: MMAudio
    vendor: Academic open-source
    category: audio
    release: 2024-12
    status: ga
    access: [open-weights]
    primitives: [audio.v2a_foley]
    limits:
      duration_s: {max: 8}
    strengths:
      - Runs on about 6GB of VRAM
    weaknesses:
      - Weights are CC-BY-NC 4.0, can't be used commercially
