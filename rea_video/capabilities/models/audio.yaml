  - id: elevenlabs-v3
    name: ElevenLabs Eleven v3
    vendor: ElevenLabs
    category: audio
    release: 2025-06
    status: ga
    access: [api, app]
    primitives: [audio.tts, audio.voice_clone]
    strengths:
