# Image models (keyframes / first frame / storyboards / on-screen text)

models:
  - id: gpt-image-2.5
    name: GPT Image 2.5
    vendor: OpenAI
    category: image
    release: 2026-09
    status: ga
    access: [api, app, api-aggregator]
    primitives: [image.t2i, image.edit_multi_ref, image.text_render]
    strengths:
      - "[User-tested] Best Chinese font rendering and highest realism — the top choice for Chinese on-screen text and photorealistic first frames"
      - Stable instruction-following; can output a transparent background (PNG/WebP); quality tiers go up to xhigh and max
    weaknesses:
      - Price and speed depend on the quality tier
    license: {commercial: true}
    sources:
      - https://www.eachlabs.ai/blog/best-ai-image-generation-models-2026
      - https://developers.openai.com/api/docs/models
    verified: {date: 2026-10-29, basis: user}
    confidence: high
    notes: "Comes in a sunburst (quality) and flare (fast) version, now superseded by gpt-image-2.6; release date is reported as September or October depending on the source; Hypit currently integrates GPT Image 2 (via HypiHub, with some 2K/4K aspect ratios unavailable)"

  - id: gpt-image-2.6
    name: "GPT Image 2.6 (Sunburst / Flare)"
    vendor: OpenAI
    category: image
    release: 2026-11
    status: ga
    access: [api, app, api-aggregator]
    primitives: [image.t2i, image.edit_multi_ref, image.text_render]
    strengths:
      - "#1 on the Artificial Analysis text-to-image leaderboard (Sunburst, the highest quality tier)"
      - Can circle an area on the image to edit (markup editing); can output a transparent background, SVG, and animated images
    weaknesses:
      - The highest quality tier can take up to about 2 minutes per image at a high price; drifts after several rounds of editing
      - Exact text positioning can still be off; the vendor doesn't document Chinese-text rendering
    license: {commercial: true}
    sources:
      - https://developers.openai.com/api/docs/guides/image-generation
      - https://developers.openai.com/api/docs/guides/image-prompting
      - https://kingy.ai/ai-launch-tracker/chatgpt-images-2-6-2026-11-04/
    verified: {date: 2026-11-12, basis: vendor}
    confidence: medium
    notes: "Released 2026-11-04; model IDs gpt-image-2.6-sunburst (quality) / gpt-image-2.6-flare (fast); side length up to 3840 and a multiple of 16, aspect ratio 1:3–3:1"

