  - id: seedream-5.0
    name: "Seedream 5.0 (Lite / Pro / Flash)"
    vendor: ByteDance Seed
    category: image
    release: 2026-02
    status: ga
    access: [app, api, api-aggregator]
    primitives: [image.t2i, image.edit_multi_ref, image.text_render, image.storyboard_series, analyze.image_layer_decompose]
    strengths:
      - Layer decomposition: outputs a background plus several transparent PNG layers, usable to reverse-engineer one frame's layout
      - Strong at infographics, interactive editing, photorealism, and multilingual text
    license: {commercial: true, note: "Per the platform's terms"}
    sources:
      - https://www.eachlabs.ai/blog/best-ai-image-generation-models-2026
      - https://docs.volcengine.com/docs/82379/1824121
    verified: {date: 2026-11-12, basis: vendor}
    confidence: medium
    notes: "Lite released 2026-02 (doubao-seedream-5-0-260128); Pro released 2026-06, API live 07-08 (doubao-seedream-5-0-pro-260628); Flash 2026-09 (doubao-seedream-5-0-flash-260915); only Lite supports batch image sets; up to 14 reference images on Lite, 10 on Pro/Flash; Hypit integrates Lite; 5.5 has since been released"

  - id: seedream-5.5
    name: Seedream 5.5
    vendor: ByteDance Seed
    category: image
    release: 2026-11
    status: ga
    access: [app, api]
    primitives: [image.t2i, image.edit_multi_ref, image.text_render, analyze.image_layer_decompose]
    limits:
      refs: {image: 10}
    strengths:
      - Stable across multiple edit rounds — the vendor claims up to 100 successive edits with untouched regions staying put
      - More accurate on dense small text and complex glyphs; can output a transparent background and decompose layers directly
    weaknesses:
      - Doesn't support batch image sets — a set of keyframes needs producing one at a time
      - Third-party testing still finds errors in small text on a complex poster
    license: {commercial: true, note: "Per the platform's terms"}
    sources:
      - https://seed.bytedance.com/zh/blog/生成更真实-百轮编辑更稳定-seedream-5-5-发布
      - https://docs.volcengine.com/docs/82379/1824121
    verified: {date: 2026-11-12, basis: vendor}
    confidence: medium
    notes: "Released 2026-11-09, model ID doubao-seedream-5-5-261028; available in Jimeng, Doubao, and Volcano Ark; a Pro version hasn't been released yet"

