  - id: qwen-image-2.1
    name: "Qwen Image 2.1 (open-source 7B, plus a Pro / Turbo API)"
    vendor: Alibaba
    category: image
    release: 2026-09
    status: ga
    access: [api, open-weights]
    primitives: [image.t2i, image.edit_multi_ref, image.text_render, image.tryon]
    limits:
      resolutions: [2K]
      refs: {image: 10}
    strengths:
      - A small 7B model, runs locally; Turbo costs about $0.016/image
      - Generation, editing, and cutout are one model, can output a transparent background directly; local edits via a circled region, a scribble, or a mask
    weaknesses:
      - The open-source weights are research-only — commercial use needs the API or a separate license
      - Ranks lower than 3.0 on leaderboards
    license: {commercial: conditional, note: "Weights are under the Qwen Research License, research-only; the API can be used commercially"}
    sources:
      - https://www.alibabacloud.com/blog/qwen-image-2-1-pro-and-turbo-apis-are-live-one-7b-model-to-generate-edit-and-cut-out_603679
      - https://huggingface.co/Qwen/Qwen-Image-2.1
    verified: {date: 2026-11-12, basis: vendor}
    confidence: medium
    notes: "Weights released 2026-09-20; Pro/Turbo API launched 2026-10-09"

