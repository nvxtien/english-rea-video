# Analysis side (decomposition): a VLM handles semantics, deterministic tools handle precise time and position
# Principle: a VLM is bad at frame-exact precision and counting (video-replicate-studio tested a VLM counting fingers — it only got 7 of 14 right),
#            so hand any precise quantity to deterministic tools — the VLM is only for interpretation and prompt drafts.

models:
  # ---------- VLM ----------
  - id: gemini-3.1-pro
    name: Gemini 3.1 Pro
    vendor: Google
    category: analysis
    status: ga
    access: [api, app]
    primitives: [analyze.video_understanding]
    limits:
      duration_s: {max: 10800}
    strengths:
      - Overall the best at video understanding; up to 3 hours; joint audio-visual understanding
    weaknesses:
      - Closed-source; timestamp precision isn't published, needs calibrating against a deterministic tool
    license: {commercial: true}
    sources:
      - https://usefulai.com/models/video-understanding
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium

  - id: gemini-3.5-flash
    name: Gemini 3.5 Flash
    vendor: Google
    category: analysis
    status: ga
    access: [api, app]
    primitives: [analyze.video_understanding]
    limits:
      duration_s: {max: 10800}
    strengths:
      - Faster and cheaper, good for a first-pass bulk decomposition
    weaknesses:
      - Weaker than 3.1 Pro at hard temporal reasoning
    license: {commercial: true}
    sources:
      - https://usefulai.com/models/video-understanding
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium

  - id: doubao-seed-2.0-pro
    name: "Doubao Seed 2.0 Pro"
    vendor: ByteDance
    category: analysis
    status: ga
    access: [api]
    primitives: [analyze.video_understanding]
    strengths:
      - Joint audio-visual analysis; overall score close to Gemini's, at a lower price
      - Directly callable within China, good for Chinese-language content
    weaknesses:
      - Maximum duration isn't published
    license: {commercial: true}
    sources:
      - https://usefulai.com/models/video-understanding
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium

  - id: pegasus-1.5
    name: Twelve Labs Pegasus 1.5
    vendor: Twelve Labs
    category: analysis
    status: ga
    access: [api]
    primitives: [analyze.video_understanding]
    limits:
      duration_s: {max: 7200}
    strengths:
      - Directly outputs timestamped summaries, chapters, and structured JSON
    weaknesses:
      - Weaker at open-ended content Q&A
    license: {commercial: true}
    sources:
      - https://usefulai.com/models/video-understanding
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium

  - id: qwen3.5-397b-a17b
    name: "Qwen3.5 397B-A17B (open-source)"
    vendor: Alibaba
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.video_understanding]
    strengths:
      - Highest video-understanding score among open-weight models, can be self-hosted
    weaknesses:
      - Needs server-grade compute; audio needs to be processed separately
    license: {commercial: conditional, note: "Per the model's license"}
    sources:
      - https://usefulai.com/models/video-understanding
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium

  # ---------- Deterministic tools ----------
  - id: pyscenedetect
    name: PySceneDetect
    vendor: Open-source
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.shot_boundary]
    strengths:
      - Lightweight; both content detection and threshold detection quickly find hard cuts
    weaknesses:
      - Dissolves and occlusion transitions are prone to being missed — locate a missed cut to the exact frame with an SSIM binary search
    license: {commercial: true, note: BSD-3-Clause}
    sources:
      - https://github.com/Breakthrough/PySceneDetect
    verified: {date: 2026-10-29, basis: knowledge}
    confidence: high

  - id: transnetv2
    name: TransNetV2
    vendor: Open-source
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.shot_boundary]
    strengths:
      - Learned shot-boundary detection, more stable than a threshold method on gradual transitions
    license: {commercial: true, note: MIT}
    sources:
      - https://github.com/soCzech/TransNetV2
    verified: {date: 2026-10-29, basis: knowledge}
    confidence: high

  - id: whisperx
    name: WhisperX
    vendor: Open-source
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.asr_word_align]
    strengths:
      - Word-level time alignment; Hypit uses it as the basis for semantic timing
    weaknesses:
      - Made-up words and unfamiliar proper nouns are prone to misrecognition
      - Chinese needs separate alignment resources prepared
    license: {commercial: true, note: BSD-2-Clause}
    sources:
      - https://github.com/m-bain/whisperX
    verified: {date: 2026-10-29, basis: knowledge}
    confidence: high

  - id: funasr-sensevoice
    name: FunASR / SenseVoice
    vendor: "Alibaba (open-source)"
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.asr_word_align]
    strengths:
      - Strong Chinese recognition and timestamps; SenseVoice also outputs emotion and audio-event tags
    license: {commercial: conditional, note: "Per the model's license"}
    sources:
      - https://github.com/modelscope/FunASR
      - https://github.com/FunAudioLLM/SenseVoice
    verified: {date: 2026-10-29, basis: knowledge}
    confidence: medium

  - id: paddleocr
    name: PaddleOCR
    vendor: "Baidu (open-source)"
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.ocr_text_track]
    strengths:
      - Strong Chinese OCR, also gives text bounding boxes
      - Per-frame recognition linked by IoU produces a text trajectory (appearance, movement, disappearance)
    license: {commercial: true, note: Apache 2.0}
    sources:
      - https://github.com/PaddlePaddle/PaddleOCR
    verified: {date: 2026-10-29, basis: knowledge}
    confidence: high

  - id: sam-video
    name: "The SAM family (SAM 2 / SAM 3)"
    vendor: "Meta (open-source)"
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.segmentation]
    strengths:
      - Video object segmentation and tracking; SAM 3 supports text prompts
    license: {commercial: conditional, note: "Per each version's license"}
    sources:
      - https://github.com/facebookresearch/sam2
    verified: {date: 2026-10-29, basis: knowledge}
    confidence: medium

  - id: matanyone-2
    name: MatAnyone 2
    vendor: Academic open-source
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.matting]
    strengths:
      - Memory-propagation-based stable video matting, good hair-edge handling; has a ComfyUI node
    license: {commercial: conditional, note: "Per the repo's license"}
    sources:
      - https://studio.aifilms.ai/blog/matanyone-2-video-matting
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium

  - id: robust-video-matting
    name: "RobustVideoMatting (RVM)"
    vendor: Open-source
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.matting]
    strengths:
      - Lightweight, real-time portrait matting; used by video-replicate-studio
    license: {commercial: conditional, note: "GPL-3.0 — watch out when integrating with a closed-source product"}
    sources:
      - https://github.com/PeterL1n/RobustVideoMatting
    verified: {date: 2026-10-29, basis: knowledge}
    confidence: medium

  - id: volcengine-matting
    name: "Volcano Engine portrait video matting"
    vendor: ByteDance
    category: analysis
    status: ga
    access: [api, api-aggregator]
    primitives: [analyze.matting]
    strengths:
      - A hosted API, outputs WEBM/MOV with an alpha channel; already integrated into Hypit
    license: {commercial: true}
    sources:
      - https://github.com/hypit-ai/hypit/blob/main/packages/provider-hypihub/README.md
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium

  - id: video-depth-anything
    name: Video Depth Anything
    vendor: "ByteDance (open-source)"
    category: analysis
    release: 2025-01
    status: ga
    access: [open-weights]
    primitives: [analyze.depth_video]
    strengths:
      - Long-video depth estimation, stable frame to frame, without the flicker of per-frame depth
      - Comes in Small / Base / Large tiers — Small runs on a consumer GPU
    weaknesses:
      - Fast turns, overlapping hands, and occlusion can still lose limbs — watch the whole clip before producing a driver from it
    license: {commercial: conditional, note: "Small is Apache 2.0; Base / Large are CC BY-NC 4.0, not for commercial use"}
    sources:
      - https://github.com/DepthAnything/Video-Depth-Anything
      - https://aiidelist.com/blog/remake-viral-video-codex-depth-maps-minimax-h3
    verified: {date: 2026-11-14, basis: third-party}
    confidence: medium
    notes: "See aiidelist's write-up for the depth-driven remake approach: convert the original to a grayscale depth video, then hand it to the video model together with a character turnaround sheet"

  - id: dwpose
    name: DWPose
    vendor: "IDEA Research (open-source)"
    category: analysis
    release: 2023-07
    status: ga
    access: [open-weights]
    primitives: [analyze.pose_track]
    strengths:
      - Full-body keypoints including fingers and face; ComfyUI's controlnet_aux has a ready-made node — feed a skeleton video into Wan VACE
    weaknesses:
      - Only 2D keypoints — left/right can flip on turns and front-back occlusion
    license: {commercial: true, note: Apache 2.0}
    sources:
      - https://github.com/IDEA-Research/DWPose
    verified: {date: 2026-11-14, basis: knowledge}
    confidence: medium

  - id: rokoko-vision
    name: Rokoko Vision 3.0
    vendor: Rokoko
    category: analysis
    status: ga
    access: [app]
    primitives: [analyze.body_mocap]
    strengths:
      - "Upload a video and get cleaned-up 3D motion, exported as FBX/BVH (HIK, Mixamo rigs), ready to drop into Blender"
    weaknesses:
      - Very small free tier; BVH export needs a paid plan
    license: {commercial: conditional, note: "Per the platform's terms"}
    sources:
      - https://rokoko.com/products/video
    verified: {date: 2026-11-14, basis: vendor}
    confidence: medium

  - id: megasam
    name: MegaSaM
    vendor: "Academic open-source (CVPR 2025)"
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.camera_motion]
    strengths:
      - Recovers camera pose and depth from casually shot dynamic video, robust on dynamic scenes
    license: {commercial: conditional, note: "Per the repo's license"}
    sources:
      - https://arxiv.org/abs/2412.04463
    verified: {date: 2026-10-29, basis: vendor}
    confidence: medium

  - id: demucs
    name: "Demucs (htdemucs)"
    vendor: "Meta (open-source)"
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.audio_separation]
    strengths:
      - Splits voice, drums, bass, and other into four stems — the industry baseline
    license: {commercial: true, note: MIT}
    sources:
      - https://github.com/facebookresearch/demucs
    verified: {date: 2026-10-29, basis: knowledge}
    confidence: high

  - id: librosa-madmom
    name: librosa / madmom
    vendor: Open-source
    category: analysis
    status: ga
    access: [open-weights]
    primitives: [analyze.beat_tempo]
    strengths:
      - Detects beat, BPM, and onsets, establishing beat anchors for the cutting rhythm
    license: {commercial: true, note: "librosa is ISC; madmom's code is BSD, its models are CC-BY-NC-SA"}
    sources:
      - https://github.com/librosa/librosa
      - https://github.com/CPJKU/madmom
    verified: {date: 2026-10-29, basis: knowledge}
    confidence: medium
