# Prompt-writing style and keyframe requirements per model
# Indexed by model id (see models/*.yaml for ids). When writing a remake prompt for a given model, adapt it per this file: `rea-video models <id>`.
# Content comes from vendor prompting guides and third-party guides, not individually verified against the model itself; `basis` states the main source, `unverified` lists anything not confirmed or where sources disagree.
# Fields: structure / language / length / multi_shot (multiple shots and timing) / references (how to refer to reference material) /
#         dialogue (dialogue and audio) / negatives (how to phrase what you don't want) / camera / frame_mode (what to write in first-frame / first-and-last-frame mode) /
#         frames (requirements on frame images and reference images) / rewriter (auto-rewrite toggle) / pitfalls (known issues) / unverified / sources

# ---------------------------------------------------------------- General keyframe practice
keyframes:
  - In first-frame mode, only write motion and camera work — don't re-describe what's already in the frame; re-describing it weakens the motion (Runway, Google, Wan, Hunyuan, Kling, and Hailuo's guides all agree; Wan 3.0 is the exception — it can include story and dialogue)
  - For models where the first frame determines the output aspect ratio (Seedance 2.5, Wan): crop the frame image to the target ratio first; keep first and last frame sizes identical, or the last frame will be stretched or cropped
  - Frame-image resolution should be no lower than the output resolution; avoid fades, transitions, and motion-blurred frames — a blurry hand or face will be exaggerated in generation
  - Erase subtitles, styled text, logos, and watermarks from a frame before using it — text and logos go back in during post; small text deforms the moment it moves
  - Pick a first frame in a pose that can continue moving — a frame at the peak of an action leaves no room to move. If the shot pushes in, frame the first frame wider; leave space on whichever side the subject is about to move toward
  - Keep the same composition and subject between first and last frame, changing only one thing; too much difference gets read as a cut or causes deformation (Kling's own guidance: keep the two frames as similar as possible). Split anything with a big difference into two segments
  - Chaining one segment's last frame into the next segment's first frame gets progressively blurrier, most visibly on faces: keep the number of relays as low as possible, and go back to a clean original frame whenever you can; at the seam, drop the last ~6 frames of the earlier segment and the first frame of the later one (Seedance's own guidance)
  - Character reference: one front-facing close-up plus one full body shot; Seedance's own guidance advises against a three-view/multi-view reference
  - Real faces: Seedance 2.x won't accept reference images or video containing a real face — a real-person frame pulled from the original can't be used as-is; Google Omni won't accept some recognizable people. Follow each platform's route for a licensed likeness, a virtual likeness, or a stylized character instead
  - Storyboard grid: produce one grid image first, then crop and upscale each cell separately for its own image-to-video call; using the whole grid directly as a first frame is unstable, but it's fine as a reference image (Seedance's omni-reference has an official example of this)

# ---------------------------------------------------------------- Video models
models:
  seedance-2.5:
    basis: vendor
    structure: >-
      Four parts: reference material labeling → a one-sentence overview (subject + location + event + genre/style + any special camera move) → the specific action (broken into segments by timestamp or "Shot N," with picture, camera work, action, dialogue, and sound effects per segment) → a closing line stating what stays constant throughout (camera position, environment, sound, mood)
    language: Both Chinese and English are supported; the vendor doesn't say which is better — keep dialogue in one language
    length: Up to 500 Chinese characters, or up to 1000 English words — going over loses detail
    multi_shot: >-
      Either "Shot N" or whole-second timestamps work: "0-3 seconds…3-7 seconds…", with no gaps between segments; "at second 2…" or "3 seconds later…" are also recognized. Don't use a timestamp to express a frequency ("shakes head 3 times per second"). For a transition, state the trigger point and method. Timestamps are a rhythm guide, not frame-exact
    references: >-
      Reference material is numbered by type and upload order: the Ark API uses "Image 1 / Video 1 / Audio 1," the Jimeng app uses @Image1, fal uses @Image1. State in words what each one is responsible for — list them out when there are several. You can also state what not to take from one ("don't use the image's background"). Asset-library material is still referred to as "Image 1" in the prompt, not by its asset ID. 1–5 subjects is most stable
    dialogue: >-
      "Character dialogue (emotion): \"content\"", e.g. the male host: "…"; background music is written as "Background music: …". Don't follow dialogue with tone/expression/action notes, and don't restate the dialogue — either tends to cause subtitles to appear. For dialogue in a language other than Chinese or English, state the language first ("the girl says softly in Japanese: …"). With multiple speakers, state who speaks and who stays silent
    negatives: >-
      There's no negative-prompt field. Describe positively wherever possible; subtitles and sound can be addressed directly ("no subtitles," "no BGM, only generate ambient sound and action sound," "no sound at all"). A BGM ban can get missed — state it once at the start and once at the end, and list synonyms (BGM, soundtrack, ambient bed)
    camera: >-
      Use standard terms directly: extreme wide to close-up; push, pull, pan, truck, track, orbit, swoop down, handheld shake; low angle, overhead, first-person; one continuous take, Hitchcock zoom, FPV, bullet time. State whether the camera is static or moving; write "static shot" for static. Keep camera movement and subject action as two separate sentences
    frame_mode: >-
      For strict frame control, use first-frame / first-and-last-frame mode (role=first_frame / last_frame) — in this mode `ratio` can only be adaptive, the output ratio follows the first frame, and you can no longer pass a reference image, video, or audio. To use reference material at the same time, go through omni-reference and write "Image 3 as the first frame, Image 5 as the last frame" — the result is only approximate. For multiple keyframes, open with "using Image 1 through Image 7, in order, as keyframes." The text describes the motion, camera work, and sound that follows
    frames: Aspect ratio 0.4–2.5, side length 300–6000 px, under 30 MB; keep reference-image resolution no higher than the output resolution; use simple line art for storyboard images, with little text on them
    rewriter: The API has no rewrite toggle
    pitfalls:
      - "Under omni-reference, words like \"edit the video, add, append, delete, remove, modify, replace, change to, extend, continue, keep going\" get read as an edit or continuation task; avoid these words for an ordinary remake, or set omni_reference_task_type=reference"
      - A reference video with subtitles makes the result prone to generating subtitles too
      - English words in the frame get misspelled — spell them out letter by letter; for a wrong Chinese character, pass the text in as a reference image instead
      - Strongly emotional words make the eyes glow — use milder words instead
      - Upload reference material in the order the characters appear, or characters get swapped
      - In a 30-second long take, a trait stated only at the start doesn't hold — repeat it in the main section; a segment left blank on the timeline is uncontrolled
      - Words like "water" or "echo" introduce watery noise into the audio
    unverified:
      - Whether 2.5 still recognizes 2.0's four audio notation symbols — sources disagree
      - No stated limit on how many shots can be written
    sources:
      - https://ark.volcengine.com/region:cn-beijing/docs/seedance-2-5-prompt-guide
      - https://docs.volcengine.com/docs/82379/2607689
      - https://docs.volcengine.com/docs/ark/seedance-2-5?lang=zh
      - https://docs.volcengine.com/docs/ark/create-video-generation-task-api?lang=zh
      - https://docs.volcengine.com/docs/ark/seedance-portrait-asset-guide?lang=zh
      - https://fal.ai/learn/devs/seedance-2-5-prompting-guide
      - https://runway.com/resources/seedance-2-5-prompt-guide
    lint:
      max_cjk: 500

  seedance-2.5-flash:
    basis: vendor
    structure: >-
      The vendor only says to write it concisely and specifically: subject, action, camera work, visual style, one action at a time. There's no separate guide — follow Seedance 2.5's style (rea-video models seedance-2.5)
    frame_mode: >-
      Same as 2.5: first/last-frame mode and omni-reference mode, which can't be mixed
    frames: >-
      Up to 720p; duration and reference-count limits aren't published
    unverified:
      - >-
        Whether Flash recognizes whole-second timestamps and the four audio notation symbols the same way 2.5 does is also unknown
    sources:
      - https://dreamina.capcut.com/seedance/seedance-2-5-flash
      - https://cellcog.ai/blog/seedance-2-5-flash/

  seedance-2.0:
    basis: vendor
    structure: Precise subject + action detail + scene/environment + lighting and color + camera work + visual style + image quality + constraints
    language: Chinese or English; keep dialogue in one language — don't mix, and don't paste in a whole script
    length: Up to 500 Chinese characters, or up to 1000 English words
    multi_shot: >-
      Use "Shot 1 / Shot 2 / Shot 3," writing camera work, action, location, and sound for each. Don't give a shot a specific second count — the vendor says precise timing support is unstable, and a hard duration limit can cause glitches. Dialogue scenes suit one continuous take; fast action is better split into segments and stitched together
    references: >-
      Define, then reuse: "Define [X] in Image 1 as Subject 1," or shorthand "Zhang San @Image1" — give each subject 2–3 stable traits; put the most important reference first. Templates: "Referencing Subject N in Image N, generate…", "Referencing the action / camera work / style / sound effect in Video N, generate…", "Referencing the timbre in Audio N, generate…". Jimeng's omni-reference can say "@Image1 as the first frame, @Video1 for camera language reference, @Audio1 for the soundtrack." Suggested: 1–2 character images, 1 scene image, 1 camera-work video, 1 audio clip — don't overload it
    dialogue: >-
      Four notations: music (Background music playing…), sound effect <a dog barking in the distance>, dialogue {Hello, world}, on-screen text 【Chapter 1: The Journey Begins】. For another language, write "says in Japanese {…}". To specify a voice, write "speaking in the timbre of @Audio1…" — the timbre will drift somewhat
    negatives: >-
      There's no negative-prompt field — constraints go at the end: "keep it subtitle-free," "avoid generating any text or subtitles," "don't generate a logo," "don't generate a watermark." The vendor admits it can't fully suppress subtitles; landscape generates fewer than portrait
    camera: Use standard camera-work terms directly (medium shot, close-up, wide shot, slow push-in, steady pan, static shot); specify only one camera move per shot
    frame_mode: >-
      For strict first/last-frame control, use first/last-frame mode (role=first_frame / last_frame) — can't be passed alongside reference material; writing "first frame is Image 1" is a looser alternative. When editing or extending a video, write "Video N" directly, not "reference Video N" — the latter gets treated as a reference task
    frames: For character reference, use a head shot plus a full-body shot; multi-view isn't recommended; a face too small in the image gets lost
    rewriter: The API has no rewrite toggle
    pitfalls:
      - Prone to generating doubles/twins — add a global ban sentence at the end
      - Heteronyms, rare characters, and similar-looking characters get mispronounced
      - A photorealistic reference image pulls a stylized scene back toward live action
      - Stability drops with more than 4 reference people
      - Repeated continuation degrades the face over time
    sources:
      - https://docs.volcengine.com/docs/82379/2222480
      - https://docs.volcengine.com/docs/ark/seedance-2-0?lang=zh
      - https://docs.volcengine.com/docs/ark/create-video-generation-task-api?lang=zh
    lint:
      max_cjk: 500
      forbid:
        - {re: '镜头\s*\d+\s*[（(]\s*\d|从\s*\d+(\.\d+)?\s*秒起', why: "Don't give Seedance 2.0 a specific second count for a shot (the vendor says precise timing support is unstable)"}

  kling-4.0:
    basis: vendor
    structure: >-
      Four parts: [Asset Roles] what each asset is for → [Overall Settings] → [Sequence of Events] events written in time order, then camera work → [Audio]. First write one sentence stating the subject, scene, action, and mood clearly, then add only camera work, timing, sound, and what to keep constant
    language: No specified prompt language; dialogue and on-screen text support Chinese, English, Japanese, Korean, Spanish, Portuguese, German, French, Hindi, Chinese dialects, and English accents
    length: Up to 8000 tokens
    multi_shot: >-
      Auto-splits into shots by default, with no toggle. Write shots directly in the prompt: "Shot 1 (5s): …" or "0–3 seconds: …". For one continuous take, you must state "No cuts" explicitly. It doesn't accept the structured shot-list field that 3.0 has
    references: >-
      Material is numbered by upload order: @Image1, @Video1, @Element1. Give each one a one-sentence role ("@Image1 defines the scene. Preserve its spatial layout, furnishings, and lighting.") — numbering alone with no stated role is unstable. To learn camera work and pacing, write "Use @Video1 as the reference for camera movements and shot pacing." To edit the original video, write "Edit @Video1," and add "Keep everything else unchanged"
    dialogue: Put dialogue in quotes, written in the target language verbatim, with the speaker's age, tone, pace, and emotion described; put sound in the [Audio] block, split into dialogue/narration, ambient sound, music, and sound effects. Subtitles only appear if explicitly requested
    negatives: The vendor says negative instructions increase errors; keep only two necessary ones — no subtitles, no background music (add no cuts too if a single shot is required)
    camera: Natural-language description (push-in, pull-out, pan, tracking, orbit, handheld) — there's no separate camera-parameter field; camera work can also be taken from a reference video
    frame_mode: >-
      Keyframe mode allows up to 10 images (first, last, or any time in between): "Use @Image1 as the first frame and @Image2 as the last frame.", with an in-between frame written as "X–Y sec | Keyframe 1: what happens". The text only describes the motion between frames. Keyframe mode can't take reference material added on top, and can't be combined with Omni Reference. Split a big jump (day to night, etc.) into two segments
    frames: The output aspect ratio follows the first keyframe; images under 30 MB, aspect ratio 2:5–5:2
    rewriter: No toggle; a very short prompt gets auto-expanded by the model
    pitfalls:
      - Abstract words (e.g. "premium look") have no effect
      - Without a stated "keep constant" item, other elements will drift too
      - If there's text in the frame image, add "Do not redraw the letters."
    unverified:
      - The official API's field names and minimum keyframe resolution need confirming
    sources:
      - https://kling.ai/quickstart/kling-4-model-user-guide
      - https://www.krea.ai/models/kling-4/prompt-guide
      - https://fal.ai/learn/tools/what-is-kling-4-0

  kling-4.0-flash:
    basis: vendor
    structure: >-
      Same writing style as Kling 4.0 (rea-video models kling-4.0): asset roles → overall settings → events in time order → sound
    length: >-
      Up to 8000 tokens
    multi_shot: >-
      Auto-splits into shots by default; shots are written directly in the prompt ("Shot 1 (5s): …"); on fal, use the multi_prompt list, with total duration equal to the sum of the shots
    references: >-
      @Image1, @Video1, @Element1, numbered by upload order, with a one-sentence role for each; fal also has @Voice1
    negatives: >-
      Keep only two: no subtitles, no background music
    frame_mode: >-
      Only accepts a first frame — doesn't support first-and-last-frame or multiple keyframes; composition is locked via the first frame or a reference image
    sources:
      - https://kling.ai/quickstart/kling-4-model-user-guide

  kling-3.0:
    basis: third-party
    structure: No fixed formula; write subject, action, scene, camera work, lighting, mood — the example order is scene → subject → camera work → action → dialogue
    language: Both Chinese and English work; dialogue supports Chinese, English, Japanese, Korean, Spanish, and regional accents
    length: Under 2500 characters overall; a custom shot is under 512 characters each — anything over gets truncated
    multi_shot: >-
      The API uses a structured shot list: shot_type=customize, with one entry per shot in multi_prompt {index, prompt, duration}, 1–6 shots, durations summing to the total (3–15 seconds) — in this mode the top-level prompt has no effect. shot_type=intelligence lets the model split shots itself, and may only produce one shot. In the prompt itself, write "[Shot 1: Wide shot] …", establishing the scene first, then listing shots in order
    references: Subjects (Elements) are bound to the first frame in the UI; up to 3 in first-frame or first-and-last-frame mode. If a subject already carries a voice, don't also set a timbre in the prompt
    dialogue: >-
      "Name (tone, language): \"dialogue\"", e.g. Mom (softly, in a surprised tone): "…"; narration is written as Voiceover (…):; a dialect is written as said in Cantonese:. Use a fixed name for each character, not a pronoun; write the action before the dialogue; use a connector like "Immediately" to keep two lines of dialogue from running together. Write ambient sound into the scene sentence
    negatives: There's a dedicated negative_prompt field (under 2500 characters); the Turbo version doesn't recognize it — put it in the prompt instead
    camera: Natural language (slow push-in, pan, tilt, tracking, dolly-in, handheld), one camera move per shot
    frame_mode: Treat the image as an anchor, describing only how the picture changes; identity, layout, and in-image text are preserved
    frames: JPEG/PNG without an alpha channel, side length 300–8000 px, aspect ratio 1:2.5–2.5:1, under 10 MB; the output ratio follows the input image. The Turbo version doesn't accept a last frame or subjects
    rewriter: No rewrite toggle; cfg_scale (default 0.5) is the only adherence control
    pitfalls:
      - An action not bound to a named character can get attributed to the wrong person
      - Auto-split shots can collapse into a single shot
    unverified:
      - The voice-reference notation (<<<voice_1>>>) has only been seen in unofficial mirrors
      - Whether custom shots can be combined with a last frame
    sources:
      - https://kling.ai/blog/kling-ai-prompt-guide
      - https://kling.ai/quickstart/klingai-video-3-model-user-guide
      - https://blog.fal.ai/kling-3-0-prompting-guide
      - https://help.aliyun.com/en/model-studio/kling-video-generation-api-reference/

  kling-o3:
    basis: vendor
    structure: >-
      Reference generation: [subject detail description] + [interaction/action between subjects] + [environment or background] + [lighting, style, and other visual direction]
    language: Both Chinese and English work
    length: Under 2500 characters
    multi_shot: >-
      "Shot 1 (2s): Wide shot, @Boxer A and @Boxer B face off…" or "[00:00 - 00:02] Medium shot: … Audio: …", total length under 15 seconds. With a reference video, only auto-split shots are available; video editing doesn't support multiple shots
    references: >-
      In the app, use @Image1 or @SubjectName ("@Alan walks in holding @Samoyed"); the official API uses <<<image_1>>>, <<<element_1>>>, <<<video_1>>>, numbered by array order; fal uses @Image1 / @Element1. Templates: "Take @Image1 as the start frame, take @Image2 as the end frame, [describe the change between the two frames]"; "Take @Image as the start frame. Generate a new video following the camera movement of the @Video"; "Based on @Video, generate the next shot: …". Keep one notation style consistent within a single prompt
    dialogue: >-
      Write dialogue as "@Character says with a barely contained smile, \"…\"" or "Goro: \"…\""; put a sound effect on its own line as Audio:. If a subject already carries a voice, no need to set a timbre separately
    negatives: The API has a negative_prompt field
    camera: Natural language; camera work can also be taken from a reference video
    frame_mode: Use the first/last-frame template above, with the text describing the change between the two frames; a last frame with no first frame isn't supported; a last frame isn't supported with more than 2 input images
    frames: Images over 300 px, under 10 MB; up to 7 subjects across images without a video, 4 with a video; 1 video clip, 3–10 seconds
    rewriter: No toggle found
    pitfalls:
      - Passing a reference video disables native audio
      - "Editing templates: \"Add @Element to @Video\" \"Remove … from @Video\" \"Change @Video to … style\" — a different style of writing from a generation prompt"
    sources:
      - https://kling.ai/quickstart/klingai-video-3-omni-model-user-guide
      - https://kling.ai/quickstart/klingai-video-o1-user-guide
      - https://help.aliyun.com/en/model-studio/kling-video-generation-api-reference/

  veo-3.1:
    basis: vendor
    structure: >-
      [Cinematography] + [Subject] + [Action] + [Context] + [Style & Ambiance]; for a short clip, one prompt should focus on a single moment
    language: Write the prompt in English
    length: No stated limit from the vendor; 1000 characters when called through the Runway API
    multi_shot: >-
      One timestamp line per shot: "[00:00-00:02] …" — the vendor's example is 4 two-second shots within 8 seconds, and a line can include SFX: and Emotion:. A single segment can only be 4, 6, or 8 seconds
    references: >-
      No notation syntax — describe it in a sentence: "Using the provided images for the detective, the woman, and the office setting, create a medium shot of…". Up to 3 images, for the same person/character/product; with reference images, only 8 seconds can be generated. Flow uses @ to refer to them
    dialogue: >-
      "A woman says: My name is Clara." — a colon after the speaking verb, no quotation marks; the vendor ties this notation to avoiding on-screen text. Sound stands on its own sentence: "SFX: thunder cracks in the distance", "Ambient noise: …". One speaker per shot, keep dialogue short, and have the speaker face the camera; split a multi-person conversation into several segments
    negatives: There's a dedicated negativePrompt field — list only nouns (subtitles, captions, on-screen text), not "no/don't" phrasing
    camera: >-
      static, pan, tilt, dolly, truck, pedestal, zoom, crane, aerial/drone, handheld, whip pan, arc; lens language like wide-angle, telephoto, shallow depth of field, rack focus
    frame_mode: The image already supplies the subject, scene, and style — the text only describes the motion; first/last-frame mode describes the transition and sound between the two frames
    frames: JPEG/PNG, under 20 MB; aspect ratio 16:9 or 9:16
    rewriter: There's an enhancePrompt toggle, on by default; whether 3.1 can disable it hasn't been verified
    pitfalls:
      - Dialogue tends to burn in garbled subtitles — use the colon notation, and put subtitles, captions into negativePrompt
      - Chinese-language lip sync has a low success rate (per community testing) — for these shots, dub or redub lip sync afterward instead
    unverified:
      - "Two official docs disagree on whether dialogue should use a colon or quotation marks — this entry goes with the colon"
      - The preview has been removed from the Gemini API — only the Vertex release version remains
    sources:
      - https://cloud.google.com/blog/products/ai-machine-learning/ultimate-prompting-guide-for-veo-3-1
      - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/video/video-gen-prompt-guide
      - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/video/best-practice
      - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/veo/3-1-generate

  grok-imagine-video-1.5:
    basis: vendor
    references: >-
      Numbered by position: <IMAGE_0>, <IMAGE_1>… — not @image; if the `image` field locks a first frame, it's <IMAGE_0>. Sound is <AUDIO_0> through <AUDIO_2> (preset voices). Give each reference image one role and a fixed position in the frame; with many reference images, keep fewer people and leave props untouched
    frame_mode: >-
      With a locked first frame, the prompt can be left empty — if written, it should only describe motion and camera work; for a loop, use the same image as both first and last frame
    dialogue: >-
      Sound is on by default — disable it with generate_audio=false; dialogue notation isn't documented by the vendor
    frames: >-
      Up to 4 keyframes, aligned to 1/3-second increments, which must fall inside the clip; image-to-video output ratio follows the input image
    sources:
      - https://docs.x.ai/developers/model-capabilities/video/reference-to-video
      - https://docs.x.ai/developers/model-capabilities/video/generation

  gemini-omni-flash:
    basis: vendor
    structure: No formula — write the scene, camera work, lighting, and mood in natural language
    language: English (other languages haven't been evaluated by the vendor)
    length: No stated limit
    multi_shot: >-
      Auto-splits into shots by default; for a single shot, you must write "In a single continuous shot" or "No scene cuts". Timecodes are written as "[0-5s] … [5-10s] …", or in natural language: "After 3 seconds, …". A single segment is 3–15 seconds. When continuing, 0 seconds starts from the continued part
    references: >-
      State each image's purpose in natural language: "The person shown in the reference image enters the scene", "Use the image as the first frame". Don't use control strings like <FIRST_FRAME> (deprecated by Google; fal still uses <IMAGE_REF_0> — follow the platform). Up to 6 reference images (3 per character, 2 characters); a reference video segment under 3 seconds each; audio references aren't accepted
    dialogue: >-
      Dialogue follows the same style as Veo — colon, no quotation marks; describe sound in a sentence: "Sound design: gentle breeze… No dialogue.", "Include calm background music". On-screen text uses quotation marks
    negatives: 'No negative field — write short sentences directly in the prompt: "No dialogue", "No extra sound effects", "No scene cuts"'
    camera: Natural language
    frame_mode: Two images are interpolated between (3–10 seconds), with text describing the transition; first-frame mode only describes motion. Keep an edit prompt as short as possible, adding "Keep everything else the same."
    frames: Use high-resolution images; output is 16:9 or 9:16
    rewriter: No toggle found
    pitfalls:
      - Won't accept an upload showing a partially recognizable person
      - An overly detailed edit prompt introduces extra unwanted changes
    sources:
      - https://aistudio.google.com/docs/omni
      - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/video/best-practice

  vidu-q3:
    basis: third-party
    structure: Subject/scene + scene description + environment description + art style/medium; use natural sentences, fewer subjects, and key style words can be repeated
    language: Not specified; voice output supports Chinese, English, and Japanese
    length: Up to 20000 characters for text-to-video, image-to-video, and first/last-frame (5000 for Turbo text-to-video); 5000 for reference-to-video
    multi_shot: Supports intelligent auto-split; no shot-list field and no official writing style — describe where to cut in a sentence
    references: >-
      Subject mode: each subject has a name and up to 3 images, referred to in the prompt as @SubjectName, up to 7 subjects. When passing images directly, describe them in order: "Image 1 is [scene]; Image 2 is [character]; Image 3 is [prop]"
    dialogue: >-
      No official format. Third-party advice: 5–9 words per line of dialogue, clean punctuation; write sound effects as "SFX: …"; describe the soundtrack by rhythm or style
    negatives: No negative field
    camera: pan, tilt, zoom, static, orbit, FPV, aerial; one camera move per shot
    frame_mode: Describe only motion and camera work
    frames: The first/last-frame resolution ratio must be between 0.8–1.25; images under 50 MB, aspect ratio no more extreme than 1:4/4:1; reference images at least 128×128
    rewriter: Keep is_rec false for image-to-video — enabled, the model ignores your prompt and writes its own
    pitfalls:
      - Lip sync drifts on a long unbroken line of dialogue or when the mouth is obscured
    unverified:
      - There's no official Q3 prompting guide — the structure and dialogue advice here come from third parties
    sources:
      - https://platform.vidu.com/docs/api-reference/video-models/vidu-q3/reference-to-video
      - https://platform.vidu.com/docs/api-reference/video-models/vidu-q3/image-to-video
      - https://platform.vidu.com/docs/api-reference/video-models/vidu-q3/start-end-to-video
      - https://help.aliyun.com/en/model-studio/vidu-video-generation-prompt-guide

  vidu-q4-preview:
    basis: vendor
    structure: >-
      No official prompting guide. Third-party advice is to split by time: 0–4 seconds establishes the scene, 4–10 seconds is the action, 10–16 seconds is the reaction; write shot size, camera work, dialogue, and sound for each segment
    length: >-
      Up to 20000 characters
    multi_shot: >-
      Auto-splits into shots; no shot-list field and no official writing style
    references: >-
      Reference-to-video takes 1–15 images plus 0–3 audio clips (mp3, 3–12 seconds). The docs mention [@SubjectName], examples use @1/@2, but also say subject-referencing isn't supported yet — the exact notation is unverified
    frame_mode: >-
      Image-to-video only accepts one image; the prompt can be left blank
    frames: >-
      png/jpeg/webp, under 50 MB (request body under 20 MB); reference mode supports aspect ratios 1:1, 9:16, 16:9, 3:4, 4:3
    rewriter: >-
      For image-to-video, is_rec defaults to true and replaces your prompt with a system-recommended one — set it to false to use your own prompt
    sources:
      - https://platform.vidu.com/docs/api-reference/video-models/vidu-q4-preview/image-to-video
      - https://platform.vidu.com/docs/api-reference/video-models/vidu-q4-preview/reference-to-video
      - https://pollo.ai/hub/how-to-use-vidu-q4

  pixverse-v6:
    basis: vendor
    structure: Three sentences — the first is subject + action + location; the second is camera work + style; the third is constraints. Put the core action first
    language: Accepts any language, English recommended
    length: At least 50–80 words; fal's limit is 2048 bytes (one Chinese character counts as 3 bytes)
    multi_shot: Multiple shots is a single toggle (generate_multi_clip_switch), with no shot-list field; structure the prompt with "Start with… Cut to… Shift to… End with…", ending with one consistency constraint sentence ("Preserve the same warm color grade across all shots"). Can't be enabled in first/last-frame transition, continuation, or fusion mode
    references: Fusion mode uses @Subject1–8, @Background1–2, @Video1–2 — every notation must correspond to a supplied reference, or the request is rejected; with a reference video, the output length follows the video
    dialogue: >-
      No official dialogue format; write sound effects and ambient sound as a short "Audio: …" line. Third parties say its audio leans toward ambient sound, with dialogue left for post
    negatives: In the app, all text is treated as a positive instruction — writing "no X" actually reinforces X; rephrase as a positive constraint ("camera stays steady") instead. Some API platforms have a negative_prompt field
    camera: Natural language, one primary camera move plus one texture word; stacking multiple camera moves causes shakiness
    frame_mode: Don't re-describe the image — write the motion, camera work, and one consistency rule; for a first/last-frame transition, add one sentence on what stays unchanged, and the two frames need to show the same continuous subject
    rewriter: thinking_type (enabled / disabled / auto) is the prompt-optimization toggle — set it explicitly as needed
    pitfalls:
      - Words like cinematic, fast, epic have no controlling effect
      - Detail placed late in a long prompt gets lost
    unverified:
      - The vendor's own platform docs couldn't be opened — parameters come from third parties
    sources:
      - https://pixverse.ai/en/blog/ai-video-prompt-guide-7-tested-fixes
      - https://runware.ai/docs/models/pixverse-v6/guides/multi-shot-storytelling
      - https://docs.comfy.org/built-in-nodes/PixverseV6FusionVideoNode.md

  minimax-h3:
    basis: vendor
    structure: >-
      Written as separate fields: integrated_multimodal_description: (the picture and action) → overall_soundscape: (ambient sound and sound effects, 1–4 sentences) → non_diegetic_music: (the soundtrack's instrumentation and tempo, 1–3 sentences, N/A if none). Don't leave the two sound fields empty — an empty field tends to introduce unwanted voice
    language: Write the prompt in English; keep dialogue and on-screen text in their original language
    length: Under 7000 characters
    multi_shot: >-
      "[Shot 1] …" with no timestamp; later shots are written as "[Shot 2] At 00:03.500, the camera cuts to...", using a single increasing point in time, not a time range. Write a dissolve or fade only when actually needed
    references: >-
      Notation: <Subject N>, <Picture N>, <Video N>, <Audio N>; a reference-generation prompt is split into six sections — subject_definitions, summary, retention_analysis, detailed_description, overall_soundscape, non_diegetic_music — stating a retention level (fully_preserved / partially_preserved / attribute_transfer / weak_reference) for each. The hosted API also accepts plain language ("following the motion in reference video 1")
    dialogue: >-
      Speakers are numbered (S1), (S2); dialogue goes inside <d>[English] I get off at the next station.</d>, with tone and action written outside the tag; narration is written "says in an off-screen voiceover" with a note that the mouth stays closed. English double quotes here mean on-screen text, not dialogue. Don't use an ellipsis inside dialogue
    negatives: No negative field; listing a banned concept tends to bring it into the frame — describe positively instead
    camera: Natural language
    frame_mode: >-
      The first line is an alignment statement, followed by a blank line: for image-to-video, "For the target video, at 0.00 seconds into the target video, <Picture 1> (from [Shot 1]) is fully referenced."; for first/last-frame, map each <Picture N> to a specific second. Frame mode and reference mode can't be mixed
    frames: Image side length 256–5760 px, aspect ratio 0.4–2.5, under 30 MB; up to 9 reference images, 3 video clips (15 seconds total), 3 audio clips
    rewriter: Only H3 Max has prompt_expansion_mode (disabled / balanced / quality) — set it to disabled for precise control
    pitfalls:
      - With an audio reference, it's prone to mixing up who's speaking — tie dialogue to a visible action
    unverified:
      - Whether the hosted API requires the separate-field format (fal's examples use ordinary paragraphs)
    sources:
      - https://huggingface.co/MiniMaxAI/MiniMax-H3/raw/main/docs/VIDEO_PROMPT_WRITING_GUIDE_base_en.md
      - https://huggingface.co/MiniMaxAI/MiniMax-H3/raw/main/docs/VIDEO_PROMPT_WRITING_GUIDE_ref_en.md
      - https://platform.minimax.io/docs/api-reference/video-generation-v2-create
      - https://docs.comfy.org/tutorials/video/minimax/minimax-h3-prompt-guide.md
    lint:
      language: en
      max_chars: 7000
      require: ["overall_soundscape:", "non_diegetic_music:"]
      forbid:
        - {re: '\d+(\.\d+)?\s*[-–~]\s*\d+(\.\d+)?\s*s\b', why: "Write a shot's time as a single point (At 00:03.500), not a range"}

  minimax-h3-max:
    basis: vendor
    structure: >-
      Same writing style as MiniMax H3 (rea-video models minimax-h3)
    length: >-
      Under 7000 characters
    references: >-
      No notation syntax — written in plain language: Video 1, Image 2, Audio 3, "Voice timbre follows reference audio 1"
    frame_mode: >-
      First/last frame can't be passed together with reference material; video and audio can only be used in reference mode
    frames: >-
      Reference images 256–5760 px, aspect ratio 0.4–2.5, under 30 MB; reference video 2–15 seconds (15 seconds total); reference audio 2–15 seconds; t2v requires specifying the aspect ratio, i2v follows the first frame
    rewriter: >-
      extra.prompt_expansion_mode: disabled / balanced (default) / quality — set to disabled for precise control
    pitfalls:
      - >-
        Duration can only be 5–15 seconds — 4 seconds errors out
      - >-
        Whether a last frame alone (no first frame) works is unclear — the docs disagree with themselves; give both together
    sources:
      - https://platform.minimax.io/docs/api-reference/video-generation-v2-create
    lint:
      language: en
      max_chars: 7000
      require: ["overall_soundscape:", "non_diegetic_music:"]
      forbid:
        - {re: '\d+(\.\d+)?\s*[-–~]\s*\d+(\.\d+)?\s*s\b', why: "Write a shot's time as a single point (At 00:03.500), not a range"}

  pika-h3-flex:
    basis: vendor
    structure: >-
      Written in playback order: the picture and scene → who's where → each action and how it ends
    language: >-
      Write the scene in English; keep dialogue and on-screen text in the target language
    length: >-
      Under 8000 characters
    multi_shot: >-
      Shot number plus start time: "[Shot 2] at 00:04"; only cut when there's genuinely new content; one camera move and one action per beat
    references: >-
      @Image1, @Video1, @Audio1, each with its role and how closely to follow it stated; an audio reference alone isn't accepted
    dialogue: >-
      Put dialogue in quotes, stating who's speaking and how; note explicitly when it's off-screen, with the on-screen person's mouth closed; on-screen text goes in quotes verbatim with "No other text" added; put sound and music on their own line, or write "No music" / "No speech"
    negatives: >-
      Use explicit prohibitions, e.g. "NO slow motion"
    camera: >-
      State distance and speed for each camera move; a push-in isn't a zoom
    frame_mode: >-
      Have the model keep what's in the first frame, then describe what happens next; with a last frame, write one continuous action that lands exactly on it
    rewriter: >-
      Optional, hosted by Pika
    sources:
      - https://pika.art/learn/pika-h3-flex-prompt-guide

  heygen-video-1:
    basis: vendor
    structure: >-
      No official prompting guide; built on MiniMax H3 — follow H3's style (rea-video models minimax-h3)
    length: >-
      Under 16000 characters
    dialogue: >-
      When dialogue is written in quotes in the prompt, setting duration to auto sizes the duration to the dialogue length
    rewriter: >-
      prompt_enhancement: turbo / quality / ultraquality / disabled — set to disabled for precise control, though it must be on for anything longer than 15 seconds
    sources:
      - https://developers.heygen.com/reference/create-heygen-video.md

  hailuo-2.3:
    basis: vendor
    structure: No official formula; the common order is shot size/camera work → subject → action → scene/lighting — a 6-second segment should have only one action beat
    language: Not specified
    length: Under 2000 characters
    multi_shot: Not supported — one shot per call, split multiple shots into multiple generations
    references: Doesn't support reference material
    dialogue: No audio — don't write dialogue or sound effects into the prompt
    negatives: No negative field
    camera: >-
      Use square-bracket directives with fixed wording: [Truck left] [Truck right] [Pan left] [Pan right] [Push in] [Pull out] [Pedestal up] [Pedestal down] [Tilt up] [Tilt down] [Zoom in] [Zoom out] [Shake] [Tracking shot] [Static shot]. Directives inside the same bracket apply together ([Pan left,Pedestal up], up to 3); separate brackets execute in order
    frame_mode: Don't re-describe the image — write only motion and camera work, stating what stays still
    frames: Only accepts a first frame, no last frame; JPG/PNG/WebP, under 20 MB, short side over 300 px, aspect ratio 2:5–5:2
    rewriter: prompt_optimizer is on by default — set to false when using square-bracket directives or needing precise control
    pitfalls:
      - Duration is only 6 or 10 seconds (1080P is 6 seconds only)
    sources:
      - https://platform.minimax.io/docs/api-reference/video-generation-t2v
      - https://platform.minimax.io/docs/api-reference/video-generation-i2v
      - https://www.eachlabs.ai/blog/how-to-write-better-hailuo-2-3-prompts

  wan-3.0:
    basis: vendor
    structure: >-
      [Overall description] + [reference-material references: Image N / Video N / Audio N] + [Shot N (start–end seconds): subject + scene + motion + aesthetic controls] + [Dialogue: xx says: "xxxx"] + [sound effects / BGM] + [style/mood] + [negative list] — skip any section you have nothing to write
    language: Chinese, English
    length: Under 20000 characters
    multi_shot: >-
      "Shot 1 [0-3 seconds]… Shot 2 [4-6 seconds] hard cut, static camera, …"; either [start-end] or (start-end) is fine, but pick one style for the whole prompt — shots run back to back, each segment 2–5 seconds. End a segment with "hard cut" or "cross-dissolve," or open the next with "seamlessly continuing from the previous segment's last frame." For one continuous shot, write "generate a single shot." Don't ask for high-frequency motion the model can't control
    references: >-
      "Image 1 / Video 1 / Audio 1" (in English: Image 1 / Video 1 / Audio 1, with a space between the word and number), images and videos numbered separately. State what each one does: "General's likeness reference Image 1, facial expression reference Image 2 …voice reference Audio 1", "camera-work style reference video", "only reference Image 2's color and lighting, not the person." Up to 10 images, 5 video clips, 5 audio clips
    dialogue: >-
      "Character + speaking verb + colon + quoted content": Image 1 says: "…"; Image 2 replies: "…"; off-screen voice: "…". You can add emotion, tone, pace, timbre, accent. Without stated dialogue the model adds its own — write "no dialogue," "no background music" if you don't want any. A voice reference stated once applies to that character's whole dialogue; for lip sync write "lip sync"
    negatives: 'Written at the end of the prompt as "negative list: no subtitles, no watermark…" — list only what you don''t want, leave it blank if there''s nothing, and don''t repeat what''s already stated positively'
    camera: >-
      Use plain language: push in, pull back, orbit, handheld follow; write "static shot, camera perfectly still, no change in position" for static; lens as "85mm telephoto, shallow depth of field" or "24mm wide-angle, deep focus"; slow motion as "high-speed photography (1000fps slow motion)"
    frame_mode: In first-frame/first-and-last-frame mode you can write the motion process, story, dialogue, and camera work, and split it by time segment; when the two frames differ a lot, describe the process of change clearly. First/last frame and reference material can't be passed together; first/last-frame mode doesn't accept audio
    frames: The output aspect ratio follows the first frame — pass a 3:4 first frame to get 3:4 output
    rewriter: prompt_extend is on by default — turn it off for a prompt already written in the structure above; it's forced on when the input includes a file or link
    pitfalls:
      - "Editing video is a different style: \"Edit the video, change xxx in Video 1 to yyy, keep the rest of the picture unchanged\" — changing one thing at a time is most stable"
    unverified:
      - Whether cuts land exactly on the stated time isn't documented
    sources:
      - https://help.aliyun.com/zh/model-studio/wan3-video-generation-prompt-guide
      - https://help.aliyun.com/zh/model-studio/wan3-video-generation-guide
      - https://help.aliyun.com/zh/model-studio/text-to-video-prompt

  wan-2.7-edit:
    basis: vendor
    structure: An editing instruction — state clearly what changes, into what, with everything else unchanged; one change per call
    language: Chinese, English
    length: Under 5000 characters; negative_prompt under 500 characters
    references: '"Video 1", "Image 1" (in English: Video 1 / Image 1); 1 video clip (2–10 seconds) plus up to 4 reference images'
    dialogue: audio_setting set to origin keeps the original audio, auto lets the model handle it
    negatives: There's a dedicated negative_prompt field
    rewriter: prompt_extend is on by default — turn it off once the instruction is already clearly written
    sources:
      - https://help.aliyun.com/zh/model-studio/wan-video-editing-api-reference
      - https://help.aliyun.com/zh/model-studio/text-to-video-prompt

  wan-2.2:
    basis: vendor
    structure: >-
      Subject + scene + motion + aesthetic controls (light source, lighting, shot size, viewpoint, lens, camera work) + stylization. State a style first if there is one, with aesthetic words as tags, followed by subject, the action's progression, and background. Don't write literary descriptions of mood or feeling
    language: Both Chinese and English work (the vendor's standard negative words and rewriter default to Chinese)
    length: Text-to-video 60–200 characters, image-to-video under 100 characters; Bailian's limit is 800 characters
    multi_shot: Not supported — one shot per call
    references: Text-to-video/image-to-video don't support reference notation
    dialogue: No audio — don't write dialogue or sound effects
    negatives: >-
      A dedicated field, with the vendor's standard negative words: garish colors, overexposed, static, blurred details, subtitles, style, artwork, painting, picture, still, overall grayish tone, worst quality, low quality, JPEG compression artifacts, ugly, incomplete, extra fingers, poorly drawn hands, poorly drawn faces, deformed, disfigured, deformed limbs, fused fingers, a static unmoving frame, cluttered background, three legs, a crowd of people in the background, walking backward. These negative words don't take effect when using an acceleration LoRA (CFG=1)
    camera: >-
      Official vocabulary — shot size: close-up, medium close-up, medium-close, medium, medium-wide, wide, extreme wide; camera position: over-the-shoulder, low angle, high angle, overhead, aerial, eye-level, low-angle-up; composition: centered, left/right-weighted, symmetrical; lighting: soft light, hard light, side light, top light, rim light, backlight; camera work: push in, pull back, pan left, tilt up, orbit, static shot. Don't add a separate shooting-angle tag once camera work is already stated in the prompt
    frame_mode: The prompt = motion + camera work; remove anything already in the frame from the prompt; write "static shot" for a locked-off camera
    frames: The output aspect ratio follows the first frame; first and last frame can have different resolutions
    rewriter: Off by default in the open-source version (the vendor recommends turning it on); Bailian's prompt_extend is on by default — turn it off for a prompt already written in the structure above
    pitfalls:
      - An acceleration LoRA tends to suppress motion, making the picture look like a live wallpaper; the community workaround is lowering LoRA strength during the high-noise stage and raising CFG to 2–3.5
    sources:
      - https://help.aliyun.com/zh/model-studio/text-to-video-prompt
      - https://github.com/Wan-Video/Wan2.2/blob/main/wan/utils/system_prompt.py
      - https://github.com/Wan-Video/Wan2.2/blob/main/wan/configs/shared_config.py

  ltx-2.5:
    basis: vendor
    structure: >-
      One continuous English paragraph, in chronological order, present tense: primary action → detail action → appearance → environment → camera work → lighting → change. Don't use labels like "Audio:" "Visual:"; write shot size, camera work, and viewpoint into the sentence, not as a prefix like "medium shot, static camera —"; don't write an inferred emotion, write the visible action
    language: English; keep dialogue in its original language, verbatim, in quotes
    length: 150–220 words — longer video needs a longer prompt
    multi_shot: >-
      Still one paragraph — don't use a shot list, numbering, or screenplay format; call out a cut within the sentence ("A hard cut transitions to…"), re-establish shot size after the cut, keep using the same names, and state whether the sound continues. 2–4 shots is recommended
    references: No reference notation
    dialogue: Put dialogue in quotes, stating the language or accent; split a long line into short sentences, with a performance cue (a glance, a pause, the voice, an action) between them. When there's audio input, the audio determines the timing structure — the prompt only describes the picture
    negatives: There are default English negative words; the distilled version (CFG=1) takes no negative input
    camera: >-
      follows, tracks, pans across, circles around, tilts upward, pushes in, pulls back, overhead view, handheld movement, over-the-shoulder, static frame; "slow dolly in" and "handheld tracking" are the most reliable. State explicitly when the camera doesn't move ("the camera remains static"); after writing the camera move, describe how the subject looks as a result. Numeric specs (2 degrees per second) have no effect
    frame_mode: Open by matching the first frame faithfully, writing it as one continuous take ("Single continuous take"); a description that doesn't match the image causes an unwanted cut
    frames: Both width and height must be divisible by 32; frame count is 8k+1
    rewriter: enhance_prompt is off by default
    pitfalls:
      - Readable on-screen text and logos, chaotic physics, many characters, and conflicting lighting are all prone to problems
    unverified:
      - Whether a sound description goes mid-sentence or at the end — official versions disagree
    sources:
      - https://ltx.io/blog/ltx-2-5-prompt-guide
      - https://ltx.io/blog/prompting-guide-for-ltx-2
      - https://ltx.io/blog/directing-dialogue-and-acting
      - https://github.com/Lightricks/LTX-2/blob/main/README.md

  hunyuanvideo-1.5:
    basis: vendor
    structure: >-
      Text-to-video: subject + motion + scene + [shot size] + [camera work] + [lighting] + [style] + [mood]. For complex action: establish the scene + break the action into steps in order (First… then… next… meanwhile… finally…) + key detail. Replace emotion words with action detail; describe direction using screen coordinates (left/right of frame, foreground/background); distinguish multiple characters by attribute or position
    language: Both Chinese and English work
    length: Can be long (around 350 words after rewriting)
    multi_shot: No multi-shot notation — one shot per call
    references: No reference notation
    dialogue: 'No audio. Quotation marks here mean on-screen text: use "…" for a Chinese prompt, "..." for an English one'
    negatives: negative_prompt is empty by default, with no official negative words; the distilled version uses CFG=1
    camera: >-
      The camera moves upward/downward, moves to the left/right, moves forward, moves back, tilts up/down, pans to the left/right, circles around, follows, remains static; Chinese: 镜头向前推进 (pushes forward), 镜头缓缓拉远 (slowly pulls back), 镜头跟随 (follows), 镜头环绕 (orbits), 镜头静止不动 (stays still), 手持镜头 (handheld)
    frame_mode: 'Image-to-video: the subject''s motion + the scene''s motion + [camera work]; don''t add camera work the user didn''t ask for'
    rewriter: rewrite is on by default — can be turned off once the prompt is already written in the structure above
    sources:
      - https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5/blob/main/assets/HunyuanVideo_1_5_Prompt_Handbook_EN.md
      - https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5/blob/main/README.md

  flux-3-video:
    basis: vendor
    structure: >-
      Subject and action → camera work → scene and mood → the texture of the motion → continuity constraints
    multi_shot: >-
      "SHOT ONE: … HARD CUT. SHOT TWO: …" — 2–3 shots recommended, total under 20 seconds; when continuing, write it as the same shot continuing, with no cut
    dialogue: >-
      Put dialogue in quotes verbatim, naming the visible speaker; label an off-screen voice as voiceover; quoted text with no named speaker can get rendered as on-screen text — add "no on-screen text or subtitles" to avoid that; for multiple languages, state the language next to each line; write "no music" for no soundtrack; tie each sound effect to a visible action
    camera: >-
      Has an official camera-work vocabulary (see sources)
    frame_mode: >-
      Image-to-video describes motion, not the image itself; first/last frame describes the transition, and the two frames should be related; multiple keyframes describe the process of change — the order matters, and the visual style should stay consistent or it gets read as a cut
    frames: >-
      Up to 10 keyframes, which can carry a timestamp; 3 or more requires specifying duration; keyframe, continuation, and draft modes are mutually exclusive
    sources:
      - https://docs.bfl.ml/guides/prompting_video_overview.md
      - https://docs.bfl.ml/guides/prompting_video_image_to_video.md
      - https://docs.bfl.ml/cookbook/video_multishot_films.md
      - https://docs.bfl.ml/guides/prompting_video_audio.md
      - https://docs.bfl.ml/guides/prompting_video_camera_terms.md

  flux-3-video-max:
    basis: vendor
    structure: >-
      No separate guide — follow FLUX 3 Video's style (rea-video models flux-3-video)
    frames: >-
      Up to 10 keyframes, specified by 24fps frame number; the last frame uses end_image_url
    unverified:
      - >-
        Whether FLUX 3 Video's writing style fully applies to Max
    sources:
      - https://docs.bfl.ml/api-reference/utility/generate-a-video-with-flux-3-max.md

  runway-gen-4.5:
    basis: vendor
    structure: >-
      Text-to-video: "[Camera] shot of [subject] [action] in [environment]. [additional description]"; image-to-video: "The camera [camera work] as the subject [action]. [additional description]". Doesn't accept JSON format
    language: Accepts any language, English is most reliable
    length: Under 1000 characters — don't write it as several long paragraphs
    multi_shot: >-
      Treated as one scene at a time. Timestamps are only used to order actions: text-to-video "[00:00 through 00:02] …", image-to-video "[00:01] X occurs. [00:03] Y occurs." or "X occurs, then Y occurs. Finally, Z occurs." — not guaranteed to be exact. If extra cuts appear, lengthen the duration or write "Continuous, seamless shot"
    references: Gen-4.5 video generation doesn't accept a reference image; to keep a character consistent, first produce a first frame with Gen-4 References (referring to a saved reference by @name in the prompt), then generate video from that first frame
    dialogue: No native audio — remove dialogue and sound effects from the prompt; for lip sync use Act-Two (input a performance video, not text)
    negatives: Doesn't support negation — it can produce the opposite result; rephrase as positive ("sharp focus" instead of "not blurry", "The locked-off camera remains perfectly still.")
    camera: All standard camera-work terms are recognized; write "Locked camera. The camera remains still." for a static shot
    frame_mode: Write almost nothing but motion — don't describe what's already in the image; refer to the subject as "the subject" or by position ("The subject on the left"). Only describe the picture when introducing a new element, a clear change, or an interaction
    frames: 'Only accepts a first frame, no last frame; a frame with motion blur or mid-action will conflict with the prompt — clean it up first; image-to-video aspect ratios: 1280:720, 720:1280, 1104:832, 960:960, 832:1104, 1584:672'
    rewriter: Enhance Prompt is an optional button in the UI — the API has no rewriting
    sources:
      - https://help.runwayml.com/hc/en-us/articles/47313737321107
      - https://help.runwayml.com/hc/en-us/articles/48324313115155
      - https://help.runwayml.com/hc/en-us/articles/47313698911891
      - https://docs.dev.runwayml.com/api/

  runway-aleph-2:
    basis: vendor
    structure: "Verb + the desired change, short and specific: add, remove, change, replace, re-light, re-style (\"Change the outfit and bag to soft yellow\"). Not a shot description"
    language: English is most reliable
    references: Edit one frame, and the model carries the change through the whole segment; Extra motion should only describe motion not in the original
    frames: Original video 2–30 seconds, 480p–1080p, 24–30 fps
    sources:
      - https://help.runwayml.com/hc/en-us/articles/52150503729171
      - https://help.runwayml.com/hc/en-us/articles/51683104370451

  luma-ray3.2:
    basis: vendor
    structure: Camera work first, then the scene, what happens, lighting, and style; add one speed word (slowly, smoothly). Use an action verb in the present progressive (running, not begins to run), present tense
    language: English
    length: Around 100 words (6000-character limit)
    multi_shot: No timestamp or multi-shot notation — one shot per call; one camera move per prompt
    references: No notation syntax; with a character reference, the prompt should only describe the scene and action — identity is left to the reference image
    dialogue: No audio — don't write dialogue or sound effects
    negatives: Positive-only, no negative field; avoid words like vibrant, whimsical, hyper-realistic
    camera: pan, tilt, dolly, zoom, tracking, crane, orbit, drone, whip pan; stacking multiple camera moves gets messy
    frame_mode: With keyframes, describe only the part that changes — not the elements that stay still
    frames: First/last frame can only produce 5 seconds; 10 seconds requires keyframes with frame numbers, and can't be combined with first/last frame; images under 50 MB, side length under 8000 px
    pitfalls:
      - Weak on dense action involving multiple subjects
      - Even when the last frame lands correctly, the motion in between isn't guaranteed to be coherent
    sources:
      - https://lumalabs.ai/news/ai-camera-movement-prompts
      - https://lumalabs.ai/learning-hub/luma-video-models-guide-ray3.14-veo-sora-kling-compared
      - https://docs.agents.lumalabs.ai/guides/video-generation

  minimax-h3-image:
    basis: vendor
    length: >-
      Up to 32000 characters; with rewriting off, only roughly the first 4096 tokens take effect
    references: >-
      <Picture 1> through <Picture 16> (per third-party reports)
    negatives: >-
      No negative prompt — the API rejects one
    frames: >-
      Size 655360–20000000 pixels, aspect ratio 1:3–3:1, or use `area` to pick 1K/2K/4K; 1–10 images per call
    rewriter: >-
      disable_prompt_enhanced defaults to false (rewriting on) — set to true for precise control
    pitfalls:
      - >-
        Requests aren't idempotent — a retry gets billed again
    sources:
      - https://platform.minimax.io/docs/api-reference/image-generation-h3-generations.md
      - https://www.orcarouter.ai/blog/minimax-h3-image-launch

  midjourney-v8.2:
    basis: third-party
    structure: >-
      A natural sentence, subject first, parameters last; don't stack tags like 8k, masterpiece
    references: >-
      --sref style reference (up to 20 images) locks the art style; --oref character reference (1 image), --ow recommended under 400, though whether V8 supports it is disputed across sources; --cref isn't supported
    negatives: >-
      --no (not supported by some third-party V8 interfaces)
    frames: >-
      Use --ar for aspect ratio; --raw reduces stylization; put on-screen text in quotes, 2–4 words is most reliable
    unverified:
      - >-
        The official page wasn't accessible — parameter support comes from third parties
    sources:
      - https://evolink.ai/docs/en/api-manual/image-series/midjourney/midjourney-v8-1-prompt-guide.md
      - https://blakecrosley.com/en/guides/midjourney

  # -------------------------------------------------------------- Image models (producing a first frame / keyframe)
  gpt-image-2.5:
    basis: vendor
    structure: >-
      Background/scene → subject → key detail → constraints, stating the intended use; split a complex prompt into labeled short sections or lines. Camera parameters are only a look-and-feel reference, not precisely simulated
    language: Mostly English; the vendor doesn't document Chinese-text rendering
    references: >-
      Label each input image by number and role: "Image 1: product photo… Image 2: style reference…", then state how they combine ("apply Image 2's style to Image 1"). For an edit, write "only change X, keep everything else the same," repeating the retention list every round ("Do not change her face, facial features, skin tone, body shape, pose, or identity in any way.")
    negatives: 'No negative field — write directly: "no watermark" "no extra text"'
    frames: Put on-screen text in quotes or all caps, stating the font; spell out a hard-to-get brand name letter by letter; side lengths must be a multiple of 16, aspect ratio under 3:1
    pitfalls:
      - "For a set of keyframes: produce one reference image first, then modify it, changing only the scene and action each time, carrying \"Same facial features, proportions, and color palette\" \"Do not redesign the character\" every time"
      - Generating several images in a row in the same session accumulates noise — start a new session
    sources:
      - https://developers.openai.com/api/docs/guides/image-prompting
      - https://developers.openai.com/cookbook/examples/multimodal/image-gen-models-prompting-guide

  gpt-image-2.6:
    basis: vendor
    structure: >-
      Scene → subject → detail → constraints, which can be split into labeled paragraphs; no special syntax. Size and quality are set via API parameters, not written into the prompt
    references: >-
      Label by number and role: image 1 is the subject, image 2 is style/clothing/background. For an edit, write "only change X," listing what to keep (identity, geometry, layout, lighting, labels), ending with "Do not change anything else"; you can circle the area to change on image 1
    negatives: >-
      No negative field — write it into the prompt ("no extra text")
    frames: >-
      Put text in quotes, stating position and font, spelling out rare words letter by letter; side length under 3840, a multiple of 16, aspect ratio 1:3–3:1
    pitfalls:
      - >-
        For a set of keyframes: make one character-reference image first, then carry it into every subsequent image, repeating appearance detail and writing "Do not redesign the character"
      - >-
        If a region must stay pixel-exact, composite that region from the original image back in after generating — don't rely on the prompt for that
      - >-
        Don't pass input_fidelity when editing
    sources:
      - https://developers.openai.com/api/docs/guides/image-prompting
      - https://developers.openai.com/api/docs/guides/image-generation

  nano-banana-2.1:
    basis: vendor
    structure: >-
      [Subject] + [Action] + [Location/environment] + [Composition] + [Style], written as a complete narrative sentence starting with a clear verb — don't stack keywords. With a reference image: [reference image] + [stated relationship] + [new scene]
    language: Mostly English; put on-screen text in quotes with the font style stated
    references: >-
      State each image's role in plain language; to lock identity, write "Keep the person's facial features exactly the same as Image 1."; for multiple people write "Make sure to only have one of each character in each image." Up to 14 images (10 objects, 4 characters). For an edit, state exactly what stays completely unchanged — no mask needed
    negatives: Don't write a negative — rephrase it positively ("empty street" instead of "no cars")
    frames: Resolution 1K/2K/4K; without a specified size, output matches the input image's size; for a set of keyframes, produce them one at a time, carrying each previous image into the next prompt and stating that the character and clothing stay unchanged
    pitfalls:
      - If an image is already 80% right, ask for a specific fix rather than regenerating the whole thing
      - Image quality degrades after several rounds of edits
      - Occasionally doesn't follow the specified aspect ratio
    sources:
      - https://cloud.google.com/blog/products/ai-machine-learning/ultimate-prompting-guide-for-nano-banana
      - https://aistudio.google.com/docs/image-generation
      - https://dev.to/googleai/nano-banana-pro-prompting-guide-strategies-1h9n

  seedream-5.0:
    basis: vendor
    structure: Concise, coherent natural language — subject + behavior + environment, with style, color, lighting, and composition added as short phrases; being concise and accurate beats stacking adjectives, and stating the intended use is fine
    language: Chinese, English
    length: Up to 300 Chinese characters, or 600 English words
    references: >-
      Refer to images as "Image 1 / Image 2" with a stated role: "replace the subject in Image 1 with the subject in Image 2", "dress Image 1's person in Image 2's clothing", "apply Image 2's style to Image 1". Anything that should stay the same must be stated explicitly ("and keep the action unchanged") — don't use a pronoun like "it." 5.0 pro / flash support a <bbox> coordinate to target a region
    negatives: The vendor's guide doesn't mention a negative prompt
    frames: >-
      Put on-screen text in double quotes. For a set of keyframes: 5.0 lite / 4.x can trigger a batch with "a series," "a set," "a group of images," or just stating the count (up to 15); 5.0 pro / flash don't support batches — produce them one at a time with the same reference images. To keep a character consistent, upload a reference image and write "the character shown in the reference image" plus the new scene
    rewriter: optimize_prompt_options.mode only has standard (default) and fast — no off option
    pitfalls:
      - Weak at rendering small text — keep text short and state its position
      - Skin can look over-smoothed — write something like "no beauty filter" to request natural flaws
    sources:
      - https://docs.volcengine.com/docs/ark/seedream-4-0-5-0-prompt-guide?lang=zh
      - https://docs.volcengine.com/docs/ark/image-generation-api?lang=zh
      - https://docs.volcengine.com/docs/ark/seedream-5-0-pro?lang=zh

  seedream-5.5:
    basis: vendor
    structure: >-
      Same writing style as Seedream 5.0 (rea-video models seedream-5.0): concise natural language for subject + behavior + environment
    length: >-
      Up to 300 Chinese characters, or 600 English words
    references: >-
      Refer to images as "Image 1 / Image 2": "replace Image 1's clothing with Image 2's clothing"; state what to keep ("keep the composition unchanged"); up to 10 images
    frames: >-
      Put text in quotes (title as "…"); size is controlled by the `size` parameter; doesn't support batches — for a set of keyframes, produce them one at a time with the same reference images
    pitfalls:
      - >-
        The vendor says up to 100 rounds of successive edits are possible, with untouched regions staying put — good for producing one image, then refining it bit by bit
    sources:
      - https://docs.volcengine.com/docs/82379/1824121

  qwen-image-3.0-pro:
    basis: vendor
    language: Only Chinese and English are supported
    length: Prompt 800–1300 tokens; negative_prompt under 500 characters
    references: 'Refer to images in array order as "Image 1 / Image 2": "the girl in Image 1 wears the black dress from Image 2 and sits in the pose from Image 3"; 3.0 accepts 1–3 input images. State what to keep explicitly (keep clothing, hairstyle, expression unchanged)'
    negatives: >-
      3.0 has a negative_prompt field. The vendor's example: low resolution, low quality, deformed limbs, deformed fingers, oversaturated image, waxy look, faces lacking detail, overly smooth, an AI feel to the image, cluttered composition, blurry and distorted text.
    frames: Strong at rendering multi-line Chinese text and paragraphs — put text inside Chinese quotation marks "…"; write size as width*height, 2688*1536 recommended for 16:9, 1536*2688 for 9:16; input image side length 384–3072 px, under 10 MB
    rewriter: prompt_extend is on by default and rewrites the prompt — turn it off for precise control
    sources:
      - https://help.aliyun.com/zh/model-studio/qwen-image-edit-guide
      - https://help.aliyun.com/zh/model-studio/qwen-image-api

  qwen-image-2.1:
    basis: vendor
    language: >-
      Chinese, English
    references: >-
      Up to 10 input images; a local edit can use a circled region, a scribble, or a mask
    frames: >-
      For a transparent background, sandwich the subject description between "This is an RGBA image with transparency." and "The image has alpha channel and the background is transparent."; native 2K, recommended sizes 2048x2048, 2752x1536, and the corresponding portrait versions
    rewriter: >-
      There's a dedicated rewriting model, Qwen-Image-2.1-PE-T2I / -PE-I2I, for expanding a short prompt
    sources:
      - https://huggingface.co/Qwen/Qwen-Image-2.1
      - https://www.alibabacloud.com/blog/qwen-image-2-1-pro-and-turbo-apis-are-live-one-7b-model-to-generate-edit-and-cut-out_603679

  flux-3:
    basis: vendor
    structure: Subject + action + style + environment, with the important part first (earlier in the prompt carries more weight); 30–80 words
    language: English is most accurate; Chinese isn't documented
    references: Refer to images by position with a stated role — "subject from image 1, style from image 2, background from image 3"; 1–10 images. For an edit, only state what changes, and explicitly state what to keep ("while maintaining the same facial features and hairstyle"), using a specific verb
    negatives: Doesn't support a negative prompt, and has no seed, guidance, or prompt_upsampling field (passing extra ones errors) — rephrase positively ("sharp focus throughout")
    frames: >-
      Put text in quotes, written early, and kept short; prefix a color value with "color" or hex and tie it to a specific object ("in color #0047AB"); in auto mode, output aspect ratio follows the first input image
    rewriter: Prompt expansion is always on and can't be disabled (per third-party reports)
    pitfalls:
      - Every panel in a storyboard set needs the full character description repeated
      - "For a set of images: fix the subject, style, lighting, and color palette, changing only the camera-work sentence; for a detailed fix, take the selected image as a reference and edit it — rewriting the prompt means starting over completely"
    unverified:
      - The JSON structured-prompt format is documented for FLUX.2 — FLUX 3 doesn't mention it
    sources:
      - https://docs.bfl.ai/guides/prompting_guide_flux2
      - https://docs.bfl.ml/guides/prompting_unified_reference.md
      - https://docs.bfl.ml/guides/prompting_editing_overview.md
      - https://runware.ai/docs/models/bfl-flux-3-image/guides/prompting

  kling-o3-image:
    basis: vendor
    structure: Natural language; state clearly what to keep, what to change, and which reference image controls which element
    length: Under 2500 characters, no separate negative field
    references: >-
      In the app, use Image 1 / Image 2; the API writes <<<image_1>>>; up to 10 images/subjects. "Use Image 1 as the base. Dress the person in Image 1 with the dress from Image 2 and the handbag from Image 3."; state what to keep as "keeping all facial features, poses, and lighting the same" "leaving everything else untouched"; change one element at a time
    frames: >-
      There's a batch mode (Omni version only; the API writes result_type: series, series_amount 2–9), which can continue a storyboard from one image ("Predict the next part of the story based on this image and generate six storyboard frames."); 1K/2K/4K
    sources:
      - https://kling.ai/quickstart/klingai-image-3-omni-user-guide
      - https://kling.ai/document-api/api/image/3-0-omni/image-omni.md
      - https://kling.ai/blog/kling-image-3-vs-omni

  # -------------------------------------------------------------- Character driving (little of this is controlled by text)
  kling-motion-control:
    basis: third-party
    structure: Prompt is optional — write identity, environment, lighting, style; don't describe the action, which is determined by the reference video
    length: Under 2500 characters
    frames: >-
      Images over 300 px, under 10 MB, subject covering at least 5% of the frame, unobstructed, head visible; the reference video is one continuous shot with only one person, no cuts or camera moves, and the image and video should match in full-body vs. half-body framing. character_orientation=image keeps the image's orientation (video 3–10 seconds), =video follows the video's orientation and camera work (3–30 seconds)
    camera: When following the image's orientation, camera work can be written into the prompt; when following the video's orientation, camera work follows the reference video
    pitfalls:
      - 3.0's subject binding uses only the face (not clothing, hairstyle, or makeup), and only works in follow-the-video-orientation mode; binding fails when several similarly sized people are in frame
      - For motion that's too fast or complex, the output can come out shorter than the reference video, with no credit refund
    sources:
      - https://kling.ai/quickstart/motion-control-user-guide
      - https://apidoc.cometapi.com/api/video/kling/motion-control.md
      - https://fal.ai/learn/devs/kling-video-2-6-motion-control-prompt-guide

  kling-avatar-v2:
    basis: vendor
    structure: Prompt is optional — write only expression, action, and camera work, not appearance ("Smiling warmly at the camera, she gently touches her necklace… stationary shot.")
    length: Under 2500 characters
    dialogue: Use commas in the dialogue text to control pauses
    frames: Images at least 300×300, aspect ratio 1:2.5–2.5:1; audio 2–300 seconds
    sources:
      - https://kling.ai/quickstart/kling-ai-avatar-2-user-guide
      - https://kling.ai/document-api/api/video/avatar.md

  wan-2.2-animate:
    basis: vendor
    structure: The Bailian interface has no prompt parameter — it only takes an image, video, and mode; the open-source version just needs a default one-sentence prompt ("the person in the video is performing an action")
    sources:
      - https://help.aliyun.com/zh/model-studio/wan-animate-move-api
      - https://github.com/Wan-Video/Wan2.2/blob/main/generate.py

  wan-animate-2:
    basis: vendor
    structure: >-
      The prompt describes the character's appearance (not the action) plus an objective background description; the vendor's template is in Chinese, generated by a large model looking at the image; viewpoint is also specified in text
    sources:
      - https://github.com/Wan-Video/Wan-Animate-2

  viggle-animate:
    basis: vendor
    structure: >-
      The video-generation step itself has no text prompt; the prompt is used in the previous step — using an image model to repaint one frame of the driving video into the new character
    sources:
      - https://viggle.ai/blog/viggle-animate-character-replacement-from-a-repainted-frame

  omnihuman-2.0:
    basis: vendor
    structure: Prompt is optional — write the scene, action, and camera work, or add an object or effect not in the image; don't describe appearance
    language: Chinese, English, Japanese, Korean, Spanish, Indonesian
    frames: Image side length 300–6000 px, aspect ratio 0.4–2.5, under 30 MB; audio 4–300 seconds, wav/mp3
    unverified:
      - The BytePlus docs' main text wasn't accessible — parameters come from fal
    sources:
      - https://fal.ai/models/fal-ai/bytedance/omnihuman/v2/llms.txt
      - https://docs.byteplus.com/en/docs/byteplus-vision/omnihuman-2-0-video-generation

  sync-3:
    basis: vendor
    structure: No visual prompt — input a video or still image, plus audio or TTS text
    language: 95+ languages; 92 built-in dubbing languages
    frames: The free tier is capped at 15 seconds per call
    sources:
      - https://sync.so/docs/models/sync-3

  sync-react-1:
    basis: vendor
    structure: >-
      options.prompt only accepts one emotion word: happy, angry, sad, neutral, disgusted, surprised; leaving it unset keeps the original video's emotion. model_mode chooses lips (mouth only), face (default), or head (head motion included)
    frames: >-
      Up to 15 seconds; only one clearly visible speaker allowed in frame
    sources:
      - https://sync.so/docs/models/react

  ltx-2.3-lipsync:
    basis: vendor
    structure: >-
      Dubbing/lip-sync template: [Speaker] is speaking [Language/Accent], saying: "[Dialogue]". Write dialogue out in full, with only one speaker, and a syllable count close to the original line
    language: Verified languages are English, French, Spanish, German, Russian
    sources:
      - https://ltx.io/blog/ltx-2-5-prompt-guide

  heygen-avatar-v:
    basis: vendor
    structure: >-
      Custom Motion uses plain language to guide the face, hands, posture, gaze, and mental state ("Look at the camera, lean in, stay serious", "Thumbs up at the end"); the API field motion_prompt only applies to Avatar V digital-avatar video; expressiveness is Avatar IV-only and gets rejected by Avatar V
    language: >-
      The platform supports 177+ languages and dialects
    length: >-
      Script up to 5000 characters; audio up to 10 minutes
    dialogue: >-
      No documented official syntax for pause and emotion markers in the script; more_blinking adds extra blinking
    sources:
      - https://developers.heygen.com/changelog
      - https://developers.heygen.com/docs/usage-limits.md

  synthesia-express-3:
    basis: vendor
    structure: >-
      No action prompt — emotion (happy, serious, neutral, friendly) is inferred automatically from the script, and gestures follow the script
    language: >-
      The platform supports 140+ languages
    sources:
      - https://www.synthesia.io/updates/express-3

  mirage-avatar-x:
    basis: vendor
    structure: >-
      No action prompt — expression, pacing, and motion follow the audio or script
    length: >-
      Script 50–1500 characters (up to 180 seconds)
    frames: >-
      Reference video 1–120 seconds or an image (short side over 512 px); audio reference 10–180 seconds, only the first 60 seconds is used; only 9:16 and 16:9
    sources:
      - https://fal.ai/mirage-avatar-x

  longcat-video-avatar-1.5:
    basis: vendor
    structure: >-
      Write a longer prompt than usual — unlike most digital-avatar models, it needs appearance, action, and scene written out
    language: >-
      Chinese, English
    pitfalls:
      - >-
        Set audio CFG to 3–5; raise it if lip sync is off
      - >-
        A long video repeats its motion — adjust --ref_img_index and --mask_frame_range
    sources:
      - https://huggingface.co/meituan-longcat/LongCat-Video-Avatar-1.5

  creatify-aurora:
    basis: third-party
    structure: >-
      The prompt describes framing, background, lighting, gaze direction, and whether the body stays still; guidance_scale and audio_guidance_scale both range 0–5
    sources:
      - https://fal.ai/models/fal-ai/creatify/aurora/llms.txt
