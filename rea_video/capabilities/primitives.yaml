# rea-video primitives
# A primitive = one vendor-agnostic capability. Model entries declare which primitives they support
# via the `primitives` field; routing rules (routing.yaml) only reference primitives, which then
# resolve to candidate models.
# Each primitive declares: inputs, output, when to use it, which metrics verify it (metrics), and
# what the probe measures (probe).

version: 0.1.0
updated: 2026-10-29

# ---------------------------------------------------------------- Validation metrics
metrics:
  cut_alignment:        {name: Cut alignment, desc: "Frame error / F1 between the reconstructed clip's cut points and the original's (tolerance ±1 frame)"}
  shot_count_match:     {name: Shot-count match, desc: "Consistency between shot count and duration distribution"}
  ocr_text_match:       {name: Text match, desc: "Character-level match rate (CER) between OCR'd text and the target copy"}
  layout_iou:           {name: Layout IoU, desc: "IoU between text/element bounding boxes and the target layout (per frame)"}
  timing_curve_error:   {name: Motion-curve error, desc: "Error between an element's position/scale/opacity curve over time and the reference"}
  pixel_similarity:     {name: Pixel similarity, desc: "SSIM / LPIPS, only applicable to footage that can be reproduced exactly, like the code layer"}
  perceptual_similarity: {name: Perceptual similarity, desc: "DreamSim / CLIP similarity, used for the generation layer"}
  identity_consistency: {name: Subject consistency, desc: "Consistency of face/product/character embeddings within a shot and across shots"}
  motion_trajectory_error: {name: Motion-trajectory error, desc: "Error between keypoint/pose trajectories and the reference action"}
  camera_path_error:    {name: Camera-path error, desc: "Difference between the estimated camera trajectory and the reference camera move"}
  beat_alignment:       {name: Beat alignment, desc: "Alignment error between cuts/motion events and the music beat"}
  lip_sync:             {name: Lip sync, desc: "A SyncNet-style LSE score"}
  audio_duration_match: {name: Audio-duration match, desc: "Duration error between generated speech and the target time window"}
  speech_wer:           {name: Speech intelligibility, desc: "Word-error rate against the script after running ASR on generated speech"}
  text_render_accuracy: {name: On-screen text accuracy, desc: "Correctness of text (especially Chinese) rendered in a generated image/video"}
  human_ab:             {name: Human blind test, desc: "Blind-test preference for looks-right / is-good / ready-to-ship"}

# ---------------------------------------------------------------- Primitives
primitives:
  # ===== Analysis (decomposition) =====
  - id: analyze.video_understanding
    group: analyze
    name: Video semantic understanding
    inputs: [video, audio, text]
    output: structured_text
    use_when: Understanding a shot's intent, performance, style, and narrative structure; drafting shot descriptions and prompts
    probe: Given a manually annotated shot set, measure shot-description accuracy, time-localization error, and correctness on counting-type questions
  - id: analyze.shot_boundary
    group: analyze
    name: Shot-boundary detection
    inputs: [video]
    output: timestamps
    use_when: The first step for every video
    metrics: [cut_alignment]
    probe: Cut-point F1 on a mixed sample of hard cuts / dissolves / occlusion transitions
  - id: analyze.asr_word_align
    group: analyze
    name: Speech recognition + word-level alignment
    inputs: [audio]
    output: transcript_with_word_times
    use_when: A video with voice; provides word anchors for subtitles, talking-head, and beat-sync
    probe: CER and word-boundary error on code-switched Chinese/English and dialect samples
  - id: analyze.ocr_text_track
    group: analyze
    name: On-screen text recognition and tracking
    inputs: [video]
    output: text_tracks
    use_when: Recognizing subtitles, titles, and UI text and when they appear/disappear/move, for rebuilding the code layer
    probe: Recognition rate and box accuracy for moving text, outlined text, and Chinese text on a complex background
  - id: analyze.segmentation
    group: analyze
    name: Segmentation and tracking
    inputs: [video, text]
    output: masks
    use_when: Separating subject/product/background, measuring element trajectories
  - id: analyze.matting
    group: analyze
    name: Video matting (alpha)
    inputs: [video]
    output: video_with_alpha
    use_when: A transparent foreground is needed (compositing a person onto a new background, subtitles passing behind a person)
  - id: analyze.camera_motion
    group: analyze
    name: Camera-motion recovery
    inputs: [video]
    output: camera_trajectory
    use_when: Determining push/pull/pan/tilt, handheld feel, or 3D camera moves, as a basis for generated camera work or 3D rendering
  - id: analyze.audio_separation
    group: analyze
    name: Audio stem separation
    inputs: [audio]
    output: stems
    use_when: Separating voice / BGM / sound effects for individual analysis and replacement
  - id: analyze.beat_tempo
    group: analyze
    name: Beat and section analysis
    inputs: [audio]
    output: beat_grid
    use_when: Beat-synced music videos; provides beat anchors for the cutting rhythm
  - id: analyze.depth_video
    group: analyze
    name: Video depth estimation
    inputs: [video]
    output: video
    use_when: Remaking dance, fighting, and other action shots — convert the original into a grayscale depth video to use as a driver, keeping the motion, blocking, space, and camera work while discarding what the original person looked like and wore
    metrics: [motion_trajectory_error]
    probe: Per-frame flicker and missing limbs on fast-turn, hand-overlap, and multi-person-occlusion segments
  - id: analyze.pose_track
    group: analyze
    name: Human skeleton tracking
    inputs: [video]
    output: keypoints
    use_when: When the target character's body type is very different from the original dancer's (chibi, animal, cartoon), drive with the skeleton instead of depth so the body shape isn't carried over
    metrics: [motion_trajectory_error]
  - id: analyze.body_mocap
    group: analyze
    name: Monocular video motion capture
    inputs: [video]
    output: animation
    use_when: When the action needs a different camera angle, needs reuse, or needs editing in 3D — convert the original motion to FBX/BVH and rig it onto a white model for re-rendering
    metrics: [motion_trajectory_error]
  - id: analyze.image_layer_decompose
    group: analyze
    name: Single-frame layer decomposition
    inputs: [image]
    output: layered_images
    use_when: Splitting one frame into a background plus transparent element layers, for understanding or replacing a layout

  # ===== Image =====
  - id: image.t2i
    group: image
    name: Text-to-image
    inputs: [text]
    output: image
    use_when: Generating keyframes, character turnarounds, B-roll stills
    metrics: [perceptual_similarity]
  - id: image.edit_multi_ref
    group: image
    name: Multi-reference image editing/compositing
    inputs: [image, text]
    output: image
    use_when: Compositing product/person/scene references into a first frame; outfit/object swaps; keeping identity consistent
    metrics: [identity_consistency, perceptual_similarity]
    probe: Appearance consistency of the same product across 5 scenes
  - id: image.text_render
    group: image
    name: On-screen text rendering
    inputs: [text, image]
    output: image
    use_when: The frame has physical text like a sign, packaging, or a poster (especially Chinese)
    metrics: [text_render_accuracy]
    probe: Rendering accuracy on 20 Chinese phrases (including rare characters, vertical text, mixed layout)
  - id: image.storyboard_series
    group: image
    name: Storyboard image set
    inputs: [text, image]
    output: images
    use_when: Producing multiple style-consistent storyboard keyframes at once for approval
  - id: image.tryon
    group: image
    name: Virtual try-on
    inputs: [image]
    output: image
    use_when: "Apparel e-commerce outfit changes: person photo + clothing photo → a photo wearing it, which then feeds image-to-video"
    metrics: [identity_consistency]

  # ===== Video generation / editing =====
  - id: video.t2v
    group: video
    name: Text-to-video
    inputs: [text]
    output: video
    use_when: Mood filler shots, B-roll with no specific subject
    metrics: [perceptual_similarity]
  - id: video.i2v_first_frame
    group: video
    name: Image-to-video (first frame)
    inputs: [image, text]
    output: video
    use_when: When composition/product/person must be exact, fix the first frame before setting it in motion
    metrics: [perceptual_similarity, identity_consistency]
  - id: video.i2v_first_last
    group: video
    name: First/last-frame generation
    inputs: [image, image, text]
    output: video
    use_when: A shot with both a fixed start and end state; an outfit change/transition; connecting to the previous segment's last frame
    metrics: [perceptual_similarity, identity_consistency]
  - id: video.keyframes
    group: video
    name: Multi-keyframe control
    inputs: [images, text]
    output: video
    use_when: A complex camera move or several in-between states that must land exactly
    metrics: [perceptual_similarity, camera_path_error]
  - id: video.multi_reference
    group: video
    name: Multi-reference video generation (subject-consistent)
    inputs: [images, text]
    output: video
    use_when: The same character/product must be consistent across multiple shots; multiple subjects in one frame
    metrics: [identity_consistency]
    probe: Identity-retention rate across 3 character references × 4 shots
  - id: video.reference_video
    group: video
    name: Reference-video generation (motion/camera-work/effect transfer)
    inputs: [video, images, text]
    output: video
    use_when: The original's time-based behavior (motion rhythm, camera work, effect evolution) can't be described with text and still frames
    metrics: [motion_trajectory_error, camera_path_error]
  - id: video.reference_audio
    group: video
    name: Reference-audio generation
    inputs: [audio, images, text]
    output: video
    use_when: Making the picture follow a given audio track (music rhythm, a specified sound)
    metrics: [beat_alignment]
  - id: video.multi_shot
    group: video
    name: Multiple shots per call
    inputs: [text, images]
    output: video
    use_when: Several consecutive shots with the same character and scene, generated in one call for consistency and natural transitions
    metrics: [cut_alignment, identity_consistency]
  - id: video.extend
    group: video
    name: Continuation / extension
    inputs: [video, text]
    output: video
    use_when: A continuous shot longer than the single-call duration limit
  - id: video.edit_v2v
    group: video
    name: Video editing (motion-preserving)
    inputs: [video, images, text]
    output: video
    use_when: Swapping a person/object/style/background or relighting existing footage, while keeping the original motion and timing
    metrics: [motion_trajectory_error, identity_consistency]
  - id: video.camera_control
    group: video
    name: Camera-work and lens-parameter control
    inputs: [text, image, video]
    output: video
    use_when: Needing to specify push/pull/pan/tilt, focal length, depth of field, or change an existing shot's camera position
    metrics: [camera_path_error]
  - id: video.native_audio
    group: video
    name: Picture-and-sound generated together
    inputs: [text, images, audio]
    output: video_with_audio
    use_when: A shot where dialogue/ambient sound is tightly coupled to the picture
    metrics: [lip_sync, speech_wer]

  # ===== Character driving =====
  - id: video.control_video
    group: video
    name: Control-video-driven generation
    inputs: [video, image, text]
    output: video
    use_when: Using a depth, skeleton, or line-art video to lock motion and structure frame by frame, with a reference image for character appearance (the local open-source pipeline for dance and fight scenes)
    metrics: [motion_trajectory_error, identity_consistency]
  - id: motion.transfer
    group: character
    name: Motion transfer
    inputs: [video, image]
    output: video
    use_when: Dance, outfit changes, a specific gesture, or a beat-synced move that needs to be reproduced exactly on a new character
    metrics: [motion_trajectory_error, identity_consistency]
  - id: avatar.audio_driven
    group: character
    name: Audio-driven digital avatar
    inputs: [image, audio, text]
    output: video
    use_when: A frontal talking-head, long-form explanation
    metrics: [lip_sync, identity_consistency]
  - id: lipsync.redub
    group: character
    name: Lip-sync redub
    inputs: [video, audio]
    output: video
    use_when: Changing the lines/language of an existing performance, changing only the mouth shape
    metrics: [lip_sync]

  # ===== 3D =====
  - id: threed.image_to_3d
    group: threed
    name: Image-to-3D
    inputs: [images]
    output: mesh
    use_when: A product needs multi-angle consistency, a turntable display, or a white-model reference for a video model
    metrics: [identity_consistency]

  # ===== Audio =====
  - id: audio.tts
    group: audio
    name: Speech synthesis
    inputs: [text]
    output: audio
    metrics: [speech_wer]
  - id: audio.voice_clone
    group: audio
    name: Voice cloning
    inputs: [audio, text]
    output: audio
    use_when: Using one's own/licensed voice for narration or talking-head
    metrics: [speech_wer]
  - id: audio.tts_duration_control
    group: audio
    name: Duration-controlled dubbing
    inputs: [text, audio]
    output: audio
    use_when: New dubbing must fit exactly into the original time window (lip sync, matching the picture)
    metrics: [audio_duration_match, speech_wer]
  - id: audio.music_gen
    group: audio
    name: Music generation
    inputs: [text, audio]
    output: audio
    use_when: Needing new, commercially usable music close to the original's BPM/mood/structure
    metrics: [beat_alignment]
  - id: audio.sfx_gen
    group: audio
    name: Text-to-sound-effect
    inputs: [text]
    output: audio
  - id: audio.v2a_foley
    group: audio
    name: Video-to-sound-effect (Foley)
    inputs: [video, text]
    output: audio
    use_when: Automatically adding sound effects synced to motion for generated footage

  # ===== Code render =====
  - id: render.code_graphics
    group: render
    name: Code-rendered motion graphics
    inputs: [code, data]
    output: video_with_alpha
    use_when: Text, UI, charts, motion graphics, subtitles — anything that needs to be 100% accurate and editable
    metrics: [ocr_text_match, layout_iou, timing_curve_error, pixel_similarity]
  - id: render.web_capture
    group: render
    name: Web page/UI recording
    inputs: [url, script]
    output: video
    use_when: "Product UI demos: directly drive and record a real or rebuilt UI"
  - id: render.3d_scene
    group: render
    name: 3D scene rendering
    inputs: [mesh, camera_trajectory]
    output: video
    use_when: Product turntables, precise camera work, white-model reference
  - id: render.compose
    group: render
    name: Compositing and encoding
    inputs: [video, audio, video_with_alpha]
    output: video
    use_when: Layering multiple elements, transitions, mixing, final encode

  # ===== Post-production =====
  - id: post.upscale
    group: post
    name: Video upscaling
    inputs: [video]
    output: video
    use_when: Upscaling a confirmed low-resolution draft (e.g. 480p) to 1080p/4K
  - id: post.frame_interp
    group: post
    name: Frame interpolation
    inputs: [video]
    output: video
    use_when: Insufficient frame rate, slow motion
